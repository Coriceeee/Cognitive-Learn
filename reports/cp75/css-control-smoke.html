@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
:root {
  --ink: #071629;
  --blue: #2563eb;
  --blue-2: #38bdf8;
  --line: #d8e7f6;
  --muted: #64748b;
  --sheet: #ffffff;
  --paper: #f6faff;
  --red: #be123c;
  --shadow: 0 26px 80px rgba(15, 60, 120, 0.13);
}

* {
  box-sizing: border-box;
}

html {
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.1), transparent 28%),
    radial-gradient(circle at 92% 18%, rgba(56, 189, 248, 0.14), transparent 24%),
    linear-gradient(135deg, rgb(var(--tc-bg-f8fbff)) 0%, rgb(var(--tc-bg-eef6ff)) 54%, rgb(var(--tc-bg-fbfdff)) 100%);
}

button,
input,
select {
  font: inherit;
}

button {
  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    opacity 0.18s ease,
    background 0.18s ease;
}

button:hover:not(:disabled) {
  transform: translateY(-1px);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.72;
}

textarea {
  font: inherit;
}


.login-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 44px;
  align-items: center;
  padding: 36px;
}

.profile-showcase-left {
  min-height: 730px;
  border-radius: 42px;
  padding: 42px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 14% 18%, rgba(56, 189, 248, 0.22), transparent 24%),
    radial-gradient(circle at 88% 84%, rgba(37, 99, 235, 0.26), transparent 28%),
    linear-gradient(135deg, #0a2159 0%, #153f9e 50%, #081b45 100%);
  color: white;
  box-shadow: 0 34px 90px rgb(var(--tc-sh-071f54) / calc(0.28 * var(--k-sh)));
  display: grid;
  grid-template-columns: 1.08fr 0.92fr;
  gap: 28px;
  align-items: center;
}

.profile-showcase-left::before {
  content: "";
  position: absolute;
  inset: 16px;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  pointer-events: none;
}

.showcase-copy {
  position: relative;
  z-index: 2;
}

.showcase-copy span {
  display: inline-flex;
  padding: 10px 15px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(191, 219, 254, 0.16);
  color: #dbeafe;
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 1.6px;
}

.showcase-copy h1 {
  margin: 24px 0 0;
  max-width: 560px;
  color: white;
  font-size: clamp(46px, 5.3vw, 74px);
  line-height: 0.95;
  letter-spacing: -2.7px;
  font-weight: 950;
}

.showcase-copy p {
  margin: 24px 0 0;
  max-width: 500px;
  color: #dbeafe;
  font-size: 16px;
  line-height: 1.72;
  font-weight: 600;
}

.profile-showcase-card {
  position: relative;
  z-index: 2;
  width: min(330px, 100%);
  justify-self: center;
  padding: 28px 24px 24px;
  border-radius: 34px;
  background:
    radial-gradient(circle at 30% 18%, rgba(96, 165, 250, 0.22), transparent 22%),
    linear-gradient(180deg, #173ea0 0%, #102f83 52%, #0a2159 100%);
  border: 1px solid rgba(191, 219, 254, 0.14);
  box-shadow:
    0 30px 70px rgb(var(--tc-sh-020c26) / calc(0.24 * var(--k-sh))),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  text-align: center;
  overflow: hidden;
}

.profile-showcase-card::before {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: 26px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  pointer-events: none;
}

.showcase-avatar-ring {
  width: 112px;
  height: 112px;
  margin: 0 auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  background:
    conic-gradient(
      from 18deg,
      rgb(var(--tc-bg-38bdf8)),
      #2563eb 34%,
      rgb(var(--tc-bg-60a5fa)) 60%,
      rgb(var(--tc-bg-93c5fd)) 82%,
      rgb(var(--tc-bg-38bdf8))
    );
  box-shadow:
    0 0 0 10px rgba(255, 255, 255, 0.05),
    0 18px 38px rgb(var(--tc-sh-020c26) / calc(0.24 * var(--k-sh)));
}

.showcase-avatar-ring::before {
  content: "";
  position: absolute;
  width: 94px;
  height: 94px;
  border-radius: 50%;
  background: #0d2d78;
}

.showcase-avatar {
  position: relative;
  z-index: 2;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 35% 28%, rgb(var(--tc-bg-ffffff) / 0.7), transparent 18%),
    linear-gradient(180deg, rgb(var(--tc-bg-facc15)), rgb(var(--tc-bg-fb923c)));
  color: white;
  font-size: 36px;
  font-weight: 950;
}

.profile-showcase-card h3 {
  margin: 18px 0 6px;
  color: white;
  font-size: 24px;
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: -0.6px;
}

.profile-showcase-card > p {
  margin: 0;
  color: #bfdbfe;
  font-size: 14px;
  font-weight: 650;
}

.showcase-pill {
  display: inline-flex;
  margin-top: 12px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(96, 165, 250, 0.22);
  border: 1px solid rgba(147, 197, 253, 0.14);
  color: #dbeafe;
  font-size: 12px;
  font-weight: 850;
}

.showcase-stats {
  margin-top: 24px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.showcase-stats article {
  min-height: 92px;
  padding: 16px 14px;
  border-radius: 18px;
  background: rgba(8, 24, 69, 0.38);
  border: 1px solid rgba(191, 219, 254, 0.08);
  text-align: left;
}

.showcase-stats strong {
  display: block;
  color: white;
  font-size: 30px;
  line-height: 1;
  font-weight: 950;
  letter-spacing: -0.8px;
}

.showcase-stats span {
  display: block;
  margin-top: 8px;
  color: #bfdbfe;
  font-size: 12px;
  font-weight: 700;
}

.showcase-note {
  margin-top: 18px;
  display: grid;
  grid-template-columns: 10px 1fr;
  gap: 12px;
  padding: 16px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(191, 219, 254, 0.1);
  text-align: left;
}

.showcase-note span {
  width: 9px;
  height: 9px;
  margin-top: 6px;
  border-radius: 50%;
  background: rgb(var(--tc-bg-38bdf8));
  box-shadow: 0 0 16px rgb(var(--tc-hl-38bdf8) / 0.9);
}

.showcase-note p {
  margin: 0;
  color: #dbeafe;
  font-size: 13px;
  line-height: 1.5;
  font-weight: 700;
}

.dot {
  position: absolute;
  border-radius: 999px;
  opacity: 0.95;
}

.d1 {
  width: 12px;
  height: 4px;
  background: rgb(var(--tc-bg-38bdf8));
  top: 20px;
  left: 22px;
}

.d2 {
  width: 8px;
  height: 8px;
  background: rgb(var(--tc-bg-fb7185));
  top: 54px;
  right: 28px;
}

.d3 {
  width: 7px;
  height: 7px;
  background: rgb(var(--tc-bg-22c55e));
  top: 132px;
  right: 18px;
}

.d4 {
  width: 12px;
  height: 4px;
  background: rgb(var(--tc-bg-facc15));
  top: 190px;
  left: 20px;
}

.d5 {
  width: 7px;
  height: 7px;
  background: rgb(var(--tc-bg-38bdf8));
  top: 88px;
  left: 36px;
}

.future-map,
.dashboard-preview,
.learning-stack,
.profile-card-inner,
.scan-board,
.map-center,
.preview-main-card,
.preview-orbit-card,
.wow-left,
.product-preview-left,
.cognitive-scan-left {
  display: none !important;
}

.auth-side {
  width: min(540px, 100%);
  justify-self: center;
  display: grid;
  gap: 24px;
}

.auth-logo-block {

.peek-toggle {
  position: absolute;
  right: 9px;
  width: 62px;
  height: calc(100% - 18px);
  border: 0;
  border-radius: 16px;
  background: rgb(var(--tc-bg-eaf4ff));
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: none;
}

.peek-toggle:hover {
  transform: none !important;
  background: rgb(var(--tc-bg-dff1ff));
}

.peek-toggle.is-peeking {
  background: linear-gradient(135deg, #2563eb, rgb(var(--tc-bg-38bdf8)));
  box-shadow: 0 10px 24px rgb(var(--tc-sh-2563eb) / calc(0.24 * var(--k-sh)));
}

.peek-face {
  width: 42px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.peek-eye {
  width: 15px;
  height: 9px;
  position: relative;
  display: block;
}

.peek-eye::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  width: 15px;
  height: 7px;
  border-bottom: 3px solid #0a3767;
  border-radius: 0 0 999px 999px;
}

.peek-pupil {
  position: absolute;
  left: 5px;
  top: 5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgb(var(--tc-bg-ffffff));
  opacity: 0;
  transform: translateX(0);
}

.peek-toggle.is-peeking .peek-eye {
  height: 15px;
  border: 2px solid rgb(var(--tc-bd-ffffff));
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  overflow: hidden;
}

.peek-toggle.is-peeking .peek-eye::before {
  display: none;
}

.peek-toggle.is-peeking .peek-pupil {
  opacity: 1;
  left: 3px;
  top: 3px;
  background: rgb(var(--tc-bg-ffffff));
  box-shadow: 0 0 10px rgb(var(--tc-hl-ffffff) / 0.9);
  animation: pupil-peek 0.38s ease both;
}

.peek-toggle.is-peeking .left-eye .peek-pupil {
  animation-delay: 0.02s;
}

.peek-toggle.is-peeking .right-eye .peek-pupil {
  animation-delay: 0.06s;
}

@keyframes pupil-peek {
  0% {
    transform: translateX(5px) scale(0.85);
  }

  60% {
    transform: translateX(-3px) scale(1);
  }

  100% {
    transform: translateX(-2px) scale(1);
  }
}

.student-notice-backdrop {
  position: fixed;

  z-index: 999;
  display: grid;
  place-items: center;

    rgba(7, 22, 41, 0.56);
  backdrop-filter: blur(14px);
  animation: studentNoticeFade 0.22s ease both;
}

.student-notice-modal {
  width: min(460px, 100%);
  position: relative;
  overflow: hidden;
  padding: 34px;
  border: 1px solid rgb(var(--tc-bd-93c5fd) / 0.45);
  border-radius: 34px;
  color: rgb(var(--tc-tx-071629));
  background:
    linear-gradient(135deg, rgb(var(--tc-bg-ffffff) / 0.98), rgb(var(--tc-bg-eff6ff) / 0.94)),
    radial-gradient(circle at 92% 10%, rgba(56, 189, 248, 0.22), transparent 32%);
  box-shadow:
    0 34px 100px rgb(var(--tc-sh-0f172a) / calc(0.34 * var(--k-sh))),
    inset 0 1px 0 rgb(var(--tc-hl-ffffff) / 0.9);
  animation: studentNoticePop 0.26s cubic-bezier(0.2, 0.9, 0.22, 1.12) both;
}

.student-notice-modal::before {
  content: "";
  position: absolute;
  inset: -80px auto auto -80px;
  width: 190px;
  height: 190px;
  border-radius: 999px;
  background: rgba(37, 99, 235, 0.12);
}

.student-notice-modal::after {
  content: "";
  position: absolute;
  right: -70px;
  bottom: -80px;
  width: 180px;
  height: 180px;
  border-radius: 999px;
  background: rgba(56, 189, 248, 0.16);
}

.student-notice-orb {
  width: 58px;
  height: 58px;
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  margin-bottom: 18px;
  border-radius: 22px;
  color: #ffffff;
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, #2563eb, rgb(var(--tc-bg-38bdf8)));

}

.student-notice-modal span {
  position: relative;
  z-index: 1;
  display: inline-flex;
  margin-bottom: 10px;
  color: rgb(var(--tc-tx-2563eb));
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.16em;
}

.student-notice-modal h2 {
  position: relative;
  z-index: 1;
  margin: 0 0 12px;
  font-size: clamp(26px, 4vw, 34px);
  line-height: 1.1;
  letter-spacing: -0.04em;
}

.student-notice-modal p {
  position: relative;
  z-index: 1;
  margin: 0;
  color: rgb(var(--tc-tx-475569));
  font-size: 15px;
  line-height: 1.75;
}

.student-notice-actions {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 26px;
}

.student-notice-actions button {
  min-width: 110px;
  padding: 12px 18px;
  border: 0;
  border-radius: 999px;
  color: #ffffff;
  font-weight: 850;
  cursor: pointer;
  background: linear-gradient(135deg, #2563eb, rgb(var(--tc-bg-38bdf8)));
  box-shadow: 0 16px 32px rgb(var(--tc-sh-2563eb) / calc(0.22 * var(--k-sh)));
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    filter 0.2s ease;
}

.student-notice-actions button:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 42px rgb(var(--tc-sh-2563eb) / calc(0.28 * var(--k-sh)));
  filter: brightness(1.03);
}

.student-notice-actions button.secondary {
  color: rgb(var(--tc-tx-2563eb));
  background: rgb(var(--tc-bg-eff6ff) / 0.92);
  box-shadow: inset 0 0 0 1px rgb(var(--tc-sh-2563eb) / calc(0.16 * var(--k-sh)));
}

@keyframes studentNoticeFade {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes studentNoticePop {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.96);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 560px) {
  .student-notice-modal {
    padding: 28px;
    border-radius: 28px;

  .student-notice-actions {
    flex-direction: column-reverse;

.student-intelligence-head h2{margin:9px 0 0;color:rgb(var(--tc-tx-071629));font-size:clamp(28px,4vw,44px);line-height:1.03;letter-spacing:-.055em}
.student-intelligence-head p{max-width:820px;margin:14px 0 0;color:rgb(var(--tc-tx-475569));font-size:14px;line-height:1.75;font-weight:650}
.student-intelligence-status{display:grid;align-content:center}
.student-intelligence-status strong{margin-top:10px;color:rgb(var(--tc-tx-071629));font-size:48px;line-height:1;letter-spacing:-.06em}
.student-career-journey{padding:28px;border-radius:32px}
.student-career-journey-head{display:flex;align-items:center;justify-content:space-between;gap:18px}
.student-career-journey-head h3{margin:8px 0 0;color:rgb(var(--tc-tx-071629));font-size:clamp(25px,3vw,36px);line-height:1.05;letter-spacing:-.045em}
.student-career-level{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;color:rgb(var(--tc-tx-047857));background:rgb(var(--tc-bg-d1fae5) / 0.9);font-size:12px;font-weight:950}
.student-career-progress{margin-top:24px;padding:20px;border-radius:24px;background:rgb(var(--tc-bg-eff6ff) / 0.72)}
.student-career-progress>div:first-child{display:flex;justify-content:space-between}
.student-career-progress>div:first-child span{color:rgb(var(--tc-tx-64748b));font-size:12px;font-weight:900}
.student-career-progress>div:first-child strong{color:rgb(var(--tc-tx-071629));font-size:24px;font-weight:950}
.student-career-progress-track{height:12px;margin-top:14px;overflow:hidden;border-radius:999px;background:rgb(var(--tc-bg-dbeafe))}
.student-career-progress-track i,.student-career-mini-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(135deg,#2563eb,rgb(var(--tc-bg-38bdf8)))}
.student-career-progress p{margin:12px 0 0;color:rgb(var(--tc-tx-64748b));font-size:12px;line-height:1.65;font-weight:650}
.student-career-journey-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.student-career-journey-grid article{min-height:170px;padding:20px;border-radius:24px;background:rgb(var(--tc-bg-ffffff) / 0.78);border:1px solid rgba(37,99,235,.11)}
.student-career-journey-grid article>span{display:grid;width:34px;height:34px;place-items:center;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2563eb,rgb(var(--tc-bg-38bdf8)));font-size:11px;font-weight:950}
.student-career-journey-grid strong{display:block;margin-top:16px;color:rgb(var(--tc-tx-071629));font-size:16px}
.student-career-journey-grid p{margin:9px 0 0;color:rgb(var(--tc-tx-64748b));font-size:13px;line-height:1.6}
.student-career-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.student-career-metrics article,.student-career-detail-grid article,.student-career-actions,.student-career-summary,.student-intelligence-support article{padding:22px;border-radius:26px}
.student-career-metrics strong{display:block;margin-top:10px;color:rgb(var(--tc-tx-071629));font-size:30px}
.student-career-metrics p,.student-career-summary p,.student-intelligence-support p{margin:10px 0 0;color:rgb(var(--tc-tx-64748b));font-size:12px;line-height:1.6}
.student-career-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.student-career-detail-grid h3,.student-career-actions h3{margin:8px 0 0;color:rgb(var(--tc-tx-071629));font-size:21px}
.student-career-detail-grid ul{display:grid;gap:15px;margin:18px 0 0;padding:0;list-style:none}
.student-career-detail-grid li{display:grid;gap:8px}
.student-career-detail-grid li>div:first-child{display:flex;justify-content:space-between;gap:14px}
.student-career-detail-grid li strong{color:rgb(var(--tc-tx-334155));font-size:13px}
.student-career-detail-grid li b{color:rgb(var(--tc-tx-2563eb))}
.student-career-detail-grid li em{padding:4px 9px;border-radius:999px;color:rgb(var(--tc-tx-92400e));background:rgb(var(--tc-bg-fef3c7));font-size:10px;font-style:normal;font-weight:950;text-transform:uppercase}
.student-career-mini-bar{height:7px;overflow:hidden;border-radius:999px;background:rgb(var(--tc-bg-e2e8f0))}
.student-career-actions ol{display:grid;gap:12px;margin:18px 0 0;padding:0;list-style:none}
.student-career-actions li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:13px 14px;border-radius:18px;background:rgb(var(--tc-bg-eff6ff) / 0.72)}
.student-career-actions li b{display:grid;width:34px;height:34px;place-items:center;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2563eb,rgb(var(--tc-bg-38bdf8)))}
.student-career-actions li p{margin:0;color:rgb(var(--tc-tx-334155));font-size:13px;font-weight:750}
.student-intelligence-support{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.student-intelligence-support strong{display:block;margin-top:9px;color:rgb(var(--tc-tx-071629));font-size:19px}
.student-career-summary p{margin:9px 0 0}
@media(max-width:980px){.student-intelligence-head{grid-template-columns:1fr}.student-career-journey-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.student-career-detail-grid{grid-template-columns:1fr}}
@media(max-width:720px){.student-career-journey-head{align-items:flex-start;flex-direction:column}.student-career-journey-grid,.student-career-metrics,.student-intelligence-support{grid-template-columns:1fr}}



.student-intelligence-section {
  display: grid;
  gap: 18px;
  margin-top: 28px;
}

.student-intelligence-hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  overflow: hidden;
  min-height: 360px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 34px;
  background:
    radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.2), transparent 30%),
    radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.18), transparent 35%),
    linear-gradient(135deg, #071629 0%, #0b1f3a 55%, #0f3b68 100%);
  box-shadow: 0 28px 80px rgb(var(--tc-sh-071629) / calc(0.22 * var(--k-sh)));
}

.student-intelligence-hero::after {
  content: "";
  position: absolute;
  width: 360px;
  height: 360px;
  right: 70px;
  top: -170px;
  border: 1px solid rgba(125, 211, 252, 0.18);
  border-radius: 50%;
  box-shadow:
    0 0 0 40px rgba(125, 211, 252, 0.03),
    0 0 0 80px rgba(125, 211, 252, 0.02);
  pointer-events: none;
}

.student-intelligence-hero-main {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 48px;
}

.student-intelligence-eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #bae6fd;
  font-size: 11px;
  font-weight: 950;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.student-intelligence-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgb(var(--tc-bg-38bdf8));
  box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.12);
}

.student-intelligence-live {
  padding: 5px 8px;
  border: 1px solid rgba(125, 211, 252, 0.18);
  border-radius: 999px;
  color: #7dd3fc;
  background: rgba(56, 189, 248, 0.08);
  font-size: 9px;
  letter-spacing: 0.12em;
}

.student-intelligence-hero h2 {
  max-width: 780px;
  margin: 16px 0 0;
  color: #f8fafc;
  font-size: clamp(36px, 5vw, 62px);
  line-height: 0.98;
  letter-spacing: -0.065em;
}

.student-intelligence-hero h2 span {
  color: #7dd3fc;
}

.student-intelligence-hero p {
  max-width: 700px;
  margin: 20px 0 0;
  color: #cbd5e1;
  font-size: 14px;
  line-height: 1.8;
  font-weight: 600;
}

.student-intelligence-hero-meta {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(130px, 0.6fr);
  gap: 12px;
  max-width: 620px;
  margin-top: 28px;
}

.student-intelligence-hero-meta > div {
  padding: 15px 17px;
  border: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(14px);
}

.student-intelligence-hero-meta span,
.student-readiness-label span,
.student-career-score-card span,
.student-career-insight span,
.student-section-kicker,
.student-intelligence-engine-grid span {
  display: block;
  color: #94a3b8;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.student-intelligence-hero-meta strong {
  display: block;
  margin-top: 6px;
  overflow: hidden;
  color: #f8fafc;
  font-size: 15px;
  font-weight: 900;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.student-readiness-orbit {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
}

.student-readiness-ring {
  display: grid;
  width: 210px;
  height: 210px;
  place-items: center;
  border-radius: 50%;
  background:
    conic-gradient(rgb(var(--tc-bg-38bdf8)) 0deg, #2563eb 250deg, rgba(255,255,255,.08) 250deg, rgba(255,255,255,.08) 360deg);
  box-shadow:
    0 0 60px rgba(56, 189, 248, 0.14),
    inset 0 0 30px rgba(255, 255, 255, 0.04);
}

.student-readiness-ring-inner {
  display: grid;
  width: 174px;
  height: 174px;
  place-items: center;
  align-content: center;
  border-radius: 50%;
  background: #091a30;
  box-shadow: inset 0 0 35px rgb(var(--tc-sh-000000) / calc(0.28 * var(--k-sh)));
}

.student-readiness-ring-inner strong {
  color: #f8fafc;
  font-size: 46px;
  line-height: 1;
  letter-spacing: -0.07em;
}

.student-readiness-ring-inner span {
  margin-top: 6px;
  color: #7dd3fc;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.student-readiness-label {
  margin-top: 18px;
  text-align: center;
}

.student-readiness-label strong {
  display: block;
  margin-top: 5px;
  color: #f8fafc;
  font-size: 13px;
  font-weight: 900;
}

.student-career-focus {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 18px;
  padding: 28px;
  border: 1px solid rgba(147, 197, 253, 0.28);
  border-radius: 30px;
  background: linear-gradient(135deg, rgb(var(--tc-bg-ffffff)), rgb(var(--tc-bg-eff6ff)));
  box-shadow: 0 20px 60px rgb(var(--tc-sh-0f3c78) / calc(0.08 * var(--k-sh)));
}

.student-section-kicker {
  color: rgb(var(--tc-tx-2563eb));
}

.student-career-focus h3 {
  margin: 8px 0 0;
  color: rgb(var(--tc-tx-071629));
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1;
  letter-spacing: -0.055em;
}

.student-career-focus-copy > p {
  max-width: 720px;
  margin: 14px 0 0;
  color: rgb(var(--tc-tx-475569));
  font-size: 14px;
  line-height: 1.75;
  font-weight: 650;
}

.student-career-insight {
  margin-top: 20px;
  padding: 16px 18px;
  border-left: 3px solid rgb(var(--tc-bd-38bdf8));
  border-radius: 0 17px 17px 0;
  background: rgb(var(--tc-bg-dbeafe) / 0.55);
}

.student-career-insight p {
  margin: 6px 0 0;
  color: rgb(var(--tc-tx-334155));
  font-size: 13px;
  line-height: 1.65;
  font-weight: 700;
}

.student-career-score-stack {
  display: grid;
  align-content: center;
  gap: 12px;
}

.student-career-score-card {
  padding: 18px;
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 21px;
  background: rgb(var(--tc-bg-ffffff) / 0.76);
}

.student-career-score-card strong {
  display: block;
  margin-top: 7px;
  color: rgb(var(--tc-tx-071629));
  font-size: 31px;
  line-height: 1;
  letter-spacing: -0.05em;
}

.student-score-line,
.student-skill-bar,
.student-gap-bar {
  height: 7px;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: rgb(var(--tc-bg-e2e8f0));
}

.student-score-line i,
.student-skill-bar i,
.student-gap-bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #2563eb, rgb(var(--tc-bg-38bdf8)));
}

.student-journey-section,
.student-skills-section,
.student-panel-card {
  padding: 26px;
  border: 1px solid rgba(147, 197, 253, 0.25);
  border-radius: 30px;
  background: rgb(var(--tc-bg-ffffff) / 0.92);
  box-shadow: 0 18px 55px rgb(var(--tc-sh-0f3c78) / calc(0.07 * var(--k-sh)));
}

.student-section-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.student-section-heading h3 {
  margin: 6px 0 0;
  color: rgb(var(--tc-tx-071629));
  font-size: 23px;
  letter-spacing: -0.04em;
}

.student-section-heading > span {
  padding: 7px 10px;
  border-radius: 999px;
  color: rgb(var(--tc-tx-2563eb));
  background: rgb(var(--tc-bg-eff6ff));
  font-size: 9px;
  font-weight: 950;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.student-journey-track {
  position: relative;
  margin-top: 34px;
}

.student-journey-line {
  position: absolute;
  top: 18px;
  left: 7%;
  right: 7%;
  height: 4px;
  overflow: hidden;
  border-radius: 999px;
  background: rgb(var(--tc-bg-e2e8f0));
}

.student-journey-line i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg,#2563eb,rgb(var(--tc-bg-38bdf8)));
}

.student-journey-nodes {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.student-journey-nodes > div {
  display: grid;
  justify-items: center;
  text-align: center;
}

.student-journey-nodes b {
  position: relative;
  z-index: 1;
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border: 4px solid rgb(var(--tc-bd-ffffff));
  border-radius: 50%;
  color: rgb(var(--tc-tx-64748b));
  background: rgb(var(--tc-bg-e2e8f0));
  font-size: 9px;
  font-weight: 950;
  box-shadow: 0 6px 18px rgb(var(--tc-sh-0f172a) / calc(0.1 * var(--k-sh)));
}

.student-journey-nodes .is-complete b,
.student-journey-nodes .is-active b {
  color: #fff;
  background: linear-gradient(135deg,#2563eb,rgb(var(--tc-bg-38bdf8)));
}

.student-journey-nodes strong {
  margin-top: 12px;
  color: rgb(var(--tc-tx-1e293b));
  font-size: 12px;
  font-weight: 900;
}

.student-journey-nodes span {
  margin-top: 4px;
  color: #94a3b8;
  font-size: 10px;
  font-weight: 650;
}

.student-skill-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin-top: 18px;
}

.student-skill-card {
  min-width: 0;
  padding: 17px;
  border: 1px solid rgb(var(--tc-bd-e2e8f0));
  border-radius: 21px;
  background: linear-gradient(160deg,rgb(var(--tc-bg-ffffff)),rgb(var(--tc-bg-f8fbff)));
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}

.student-skill-card:hover {
  transform: translateY(-3px);
  border-color: rgb(var(--tc-bd-bfdbfe));
  box-shadow: 0 16px 32px rgb(var(--tc-sh-2563eb) / calc(0.09 * var(--k-sh)));
}

.student-skill-card-top {
  display: grid;
  grid-template-columns: 29px minmax(0,1fr) auto;
  gap: 8px;
  align-items: start;
}

.student-skill-index {
  display: grid;
  width: 29px;
  height: 29px;
  place-items: center;
  border-radius: 10px;
  color: rgb(var(--tc-tx-2563eb));
  background: rgb(var(--tc-bg-eff6ff));
  font-size: 9px;
  font-weight: 950;
}

.student-skill-card-top strong {
  min-width: 0;
  color: rgb(var(--tc-tx-334155));
  font-size: 12px;
  line-height: 1.35;
}

.student-skill-card-top b {
  color: rgb(var(--tc-tx-071629));
  font-size: 15px;
}

.student-skill-card-bottom {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}

.student-skill-card-bottom span {
  color: #94a3b8;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.student-intelligence-split {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 18px;
}

.student-gap-list,
.student-action-list {
  display: grid;
  gap: 14px;
  margin-top: 20px;
}

.student-gap-item {
  padding: 14px;
  border-radius: 18px;
  background: rgb(var(--tc-bg-f8fafc));
}

.student-gap-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.student-gap-top > div {
  display: flex;
  align-items: center;
  gap: 9px;
}

.student-gap-top > div > span {
  color: #94a3b8;
  font-size: 9px;
  font-weight: 950;
}

.student-gap-top strong {
  color: rgb(var(--tc-tx-334155));
  font-size: 12px;
}

.student-gap-top em {
  padding: 5px 8px;
  border-radius: 999px;
  color: rgb(var(--tc-tx-92400e));
  background: rgb(var(--tc-bg-fef3c7));
  font-size: 8px;
  font-style: normal;
  font-weight: 950;
  white-space: nowrap;
}

.student-gap-bar {
  margin-top: 11px;
}

.student-action-list {
  list-style: none;
  padding: 0;
  margin-bottom: 0;
}

.student-action-list li {
  display: grid;
  grid-template-columns: 32px minmax(0,1fr) 18px;
  gap: 11px;
  align-items: center;
  padding: 13px;
  border: 1px solid rgb(var(--tc-bd-e2e8f0));
  border-radius: 17px;
  background: rgb(var(--tc-bg-ffffff));
}

.student-action-list li b {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 10px;
  color: #fff;
  background: #071629;
  font-size: 10px;
}

.student-action-list li p {
  margin: 0;
  color: rgb(var(--tc-tx-334155));
  font-size: 12px;
  line-height: 1.55;
  font-weight: 750;
}

.student-action-list li > span {
  color: rgb(var(--tc-tx-2563eb));
  font-size: 17px;
  font-weight: 900;
}

.student-empty-state {
  margin-top: 18px;
  padding: 22px;
  border-radius: 18px;
  color: rgb(var(--tc-tx-64748b));
  background: rgb(var(--tc-bg-f8fafc));
  font-size: 12px;
  font-weight: 650;
}

.student-intelligence-engine-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 14px;
}

.student-intelligence-engine-grid article {
  display: grid;
  grid-template-columns: 45px minmax(0,1fr);
  gap: 13px;
  align-items: center;
  padding: 18px;
  border: 1px solid rgba(148,163,184,.18);
  border-radius: 22px;
  background: #071629;
  box-shadow: 0 14px 35px rgb(var(--tc-sh-071629) / calc(0.12 * var(--k-sh)));
}

.student-engine-icon {
  display: grid;
  width: 45px;
  height: 45px;
  place-items: center;
  border-radius: 14px;
  color: #7dd3fc;
  background: rgba(56,189,248,.1);
  border: 1px solid rgba(125,211,252,.15);
  font-size: 21px;
}

.student-intelligence-engine-grid span {
  color: #7dd3fc;
}

.student-intelligence-engine-grid strong {
  display: block;
  margin-top: 5px;
  overflow: hidden;
  color: #f8fafc;
  font-size: 16px;
  font-weight: 900;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.student-intelligence-engine-grid p {
  margin: 4px 0 0;
  color: #94a3b8;
  font-size: 10px;
  line-height: 1.45;
}

@media (max-width: 1100px) {
  .student-skill-grid {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
}

@media (max-width: 900px) {
  .student-intelligence-hero,
  .student-career-focus {

.student-dash {

}
.student-dash-hero {

.student-dash-hero-copy,
.student-dash-hero-summary { position: relative; z-index: 1; min-width: 0; }

.student-dash-hero h1 {

.student-dash-primary-button,

.student-dash-primary-button {

.student-dash-secondary-link {

.student-dash-hero-summary-top small {

}
.student-dash-hero-divider {

}
.student-dash-hero-metrics { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.student-dash-hero-metrics strong { display: block; margin-top: 8px; font-size: 21px; }
.student-dash-hero-footnote {

  line-height: 1.5;
}
.student-dash-focus {
  margin-top: 22px;

  gap: 20px;
  align-items: stretch;

.student-dash-card,
.student-dash-module {

.student-dash-card { padding: 23px; }
.student-dash-heading {

}
.student-dash-heading h2 {
  margin: 5px 0 0;
  color: rgb(var(--tc-tx-112748));

}
.student-dash-soft-pill {

  border-radius: 100px;

  background: rgb(var(--tc-bg-f0f5ff));
  color: rgb(var(--tc-tx-335f9d));
}
.student-dash-action-list { display: grid; gap: 9px; }
.student-dash-action {
  display: flex;
  gap: 15px;
  align-items: center;
  padding: 15px;

  border: 1px solid rgb(var(--tc-bd-e8eef9));
  border-radius: 12px;

}
.student-dash-action:hover { background: rgb(var(--tc-bg-eff5ff)); border-color: rgb(var(--tc-bd-c5d9ff)); }
.student-dash-action-num {

  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 800;

.student-dash-action-body { display: block; min-width: 0; flex: 1; }

  line-height: 1.5;
}
.student-dash-action-body small {

  font-size: 11px;

}
.student-dash-action-arrow { color: rgb(var(--tc-tx-2563eb)); font-size: 18px; }
.student-dash-status-list { display: grid; gap: 0; }
.student-dash-status-list > div {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid rgb(var(--tc-bd-edf1f8));
  font-size: 12px;
}
.student-dash-status-list > div:first-child { padding-top: 3px; }
.student-dash-status-list span { color: rgb(var(--tc-tx-64758e)); }
.student-dash-status-list strong { color: rgb(var(--tc-tx-253b5a)); font-size: 12px; text-align: right; }
.student-dash-status-list strong.is-ok { color: rgb(var(--tc-tx-17806b)); }
.student-dash-status-list strong.is-pending { color: rgb(var(--tc-tx-aa732b)); }
.student-dash-status-note {
  font-size: 11px;
  line-height: 1.6;
  margin: 15px 0 0;
  color: #7890ae;
}
.student-dash-modules { margin-top: 32px; }
.student-dash-module-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 14px;
}
.student-dash-module {
  min-height: 171px;
  padding: 21px;

.student-dash-module p { color: rgb(var(--tc-tx-71819a)); margin: 8px 0 16px; line-height: 1.55; font-size: 12px; }
.student-dash-module-arrow { color: rgb(var(--tc-tx-2563eb)); font-size: 12px; font-weight: 800; margin-top: auto; }
.student-dash-extra-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 13px; }
.student-dash-extra-links a {

  align-items: center;

  border: 1px solid rgb(var(--tc-bd-d9e7ff));

  padding: 10px 14px;

  margin-top: 9px;

}

.student-dash-disclosure > summary strong { display: block; color: rgb(var(--tc-tx-1b3152)); font-size: 14px; }
.student-dash-disclosure > summary small {
  display: block;
  margin-top: 5px;
  color: rgb(var(--tc-tx-7a8da6));

.student-dash-disclosure[open] .student-dash-chevron { transform: rotate(180deg); }

.student-dash :focus-visible { outline: 3px solid #5c9dff; outline-offset: 3px; }
@media (max-width: 1024px) {
  .student-dash-hero,
  .student-dash-focus { grid-template-columns: 1fr; }

@media (max-width: 640px) {

  .student-dash-module { min-height: 134px; }
  .student-dash-card { padding: 18px; }
  .student-dash-disclosure > summary { padding: 16px; }
  .student-dash-disclosure-content { padding: 13px; }
  .student-dash-heading { align-items: flex-start; }
}

.user-nav {
  position: relative;
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 40;
}

.user-nav-link {
  border: 0;
  background: transparent;
  color: rgb(var(--tc-tx-64748b));
  text-decoration: none;
  font-size: 12px;
  font-weight: 850;
  display: grid;
  justify-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 0;
  transition:
    transform 0.22s ease,
    opacity 0.22s ease;
}

.user-nav-link:hover {
  transform: translateY(-2px);
}

.user-nav-link small {
  color: rgb(var(--tc-tx-5b6b82));
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.2px;
  transition: color 0.22s ease;
}

.user-nav-link:hover small {
  color: rgb(var(--tc-tx-1d4ed8));
}

.user-nav-icon,
.user-nav-avatar {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: rgb(var(--tc-tx-0f3c78));
  background:
    radial-gradient(
      circle at 30% 25%,
      rgb(var(--tc-bg-ffffff) / 0.98),
      rgb(var(--tc-bg-ffffff) / 0.82) 35%,
      rgb(var(--tc-bg-dbeafe) / 0.96) 100%
    );
  border: 1px solid rgb(var(--tc-bd-d8e7f6));
  box-shadow:
    0 10px 22px rgb(var(--tc-sh-0f3c78) / calc(0.1 * var(--k-sh))),
    inset 0 1px 0 rgb(var(--tc-hl-ffffff) / 0.95);
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    border-color 0.25s ease,
    color 0.25s ease;
  animation: claIconFloat 3.2s ease-in-out infinite;
}

.user-nav-link:nth-child(2) .user-nav-icon {
  animation-delay: 0.15s;
}

.user-nav-link:nth-child(3) .user-nav-icon {
  animation-delay: 0.3s;
}

.user-nav-link:nth-child(4) .user-nav-icon,
.user-nav-link:nth-child(4) .user-nav-avatar {
  animation-delay: 0.45s;
}

.user-nav-link:hover .user-nav-icon,
.user-nav-link:hover .user-nav-avatar {
  transform: translateY(-2px) scale(1.06);
  color: rgb(var(--tc-tx-2563eb));
  border-color: rgb(var(--tc-bd-93c5fd));
  box-shadow:
    0 14px 28px rgb(var(--tc-sh-2563eb) / calc(0.18 * var(--k-sh))),
    0 0 18px rgba(56, 189, 248, 0.22),
    inset 0 1px 0 rgb(var(--tc-hl-ffffff) / 0.95);
}

}

.user-dropdown-head strong {

.user-dropdown-head p {

.user-dropdown-body a:hover,

.user-dropdown-body span {

  box-shadow: inset 0 1px 0 rgb(var(--tc-hl-ffffff) / 0.85);
}

.user-dropdown-body strong {
  display: block;
  color: rgb(var(--tc-tx-071629));

  font-weight: 950;
}

.user-dropdown-body p {

.user-nav-link.admin-top-link .user-nav-icon {

  background: linear-gradient(135deg, #2563eb, rgb(var(--tc-bg-38bdf8)));
  border-color: transparent;
  box-shadow:

}

.user-nav-link.admin-top-link small {
  color: rgb(var(--tc-tx-2563eb));
  font-weight: 950;
}

.user-dropdown-body .admin-return-link {
  background:
    radial-gradient(circle at 90% 10%, rgba(56, 189, 248, 0.18), transparent 28%),
    linear-gradient(135deg, rgb(var(--tc-bg-eef7ff)), rgb(var(--tc-bg-ffffff)));
  border: 1px solid rgb(var(--tc-bd-dbeafe));
}

.user-dropdown-body .admin-return-link span {
  color: white;
  background: linear-gradient(135deg, #2563eb, rgb(var(--tc-bg-38bdf8)));
  box-shadow: 0 10px 22px rgb(var(--tc-sh-2563eb) / calc(0.2 * var(--k-sh)));
}

.orbit-dot {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgb(var(--tc-bg-7dd3fc));
  box-shadow: 0 0 24px rgb(var(--tc-hl-7dd3fc) / 0.95);
}

.orbit-dot.d-a {
  top: 20px;
  left: 50%;
}

.orbit-dot.d-b {
  right: 26px;
  top: 50%;
}

.orbit-dot.d-c {
  bottom: 28px;
  left: 34%;
}

.orbit-dot.d-d {
  left: 32px;
  top: 42%;
}

@keyframes claIconFloat {
  0% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-2px);
  }

  100% {
    transform: translateY(0);
  }
}

@keyframes claPulse {
  0% {
    transform: scale(1);
    box-shadow: 0 14px 28px rgb(var(--tc-sh-020c26) / calc(0.18 * var(--k-sh)));
  }

  50% {
    transform: scale(1.05);
    box-shadow: 0 18px 34px rgb(var(--tc-sh-2563eb) / calc(0.24 * var(--k-sh)));
  }

  100% {
    transform: scale(1);
    box-shadow: 0 14px 28px rgb(var(--tc-sh-020c26) / calc(0.18 * var(--k-sh)));
  }
}

  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 14px 16px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.11);
  border: 1px solid rgba(255, 255, 255, 0.11);

  font-weight: 720;
  line-height: 1.45;
}

.module-path-action button {

  padding: 0 16px;

  cursor: pointer;
  font-size: 13px;
  font-weight: 950;
  transition:
    transform 0.2s ease,
    opacity 0.2s ease;
}

.module-path-action button:hover {
  transform: translateY(-1px);
}

.module-path-action button:disabled {
  cursor: not-allowed;
  opacity: 0.44;
  transform: none;
}

@media (max-width: 1080px) {
  .module-path-layout {
    grid-template-columns: 1fr;

}

@media (max-width: 720px) {

.orion-page {
  min-height: 100vh;
  color: rgb(var(--tc-tx-071629));
  background:
    radial-gradient(circle at 10% 8%, rgba(37, 99, 235, 0.12), transparent 28%),
    radial-gradient(circle at 90% 18%, rgba(56, 189, 248, 0.14), transparent 30%),
    linear-gradient(180deg, rgb(var(--tc-bg-f8fbff)) 0%, rgb(var(--tc-bg-eef6ff)) 100%);
}

.orion-floating-header {
  position: sticky;
  top: 0;
  z-index: 30;
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 18px 0 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}

.orion-floating-header > * {
  pointer-events: auto;
}

.orion-home-logo {
  width: 58px;
  height: 58px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  background: rgb(var(--tc-bg-ffffff) / 0.78);
  border: 1px solid rgb(var(--tc-bd-bfdbfe) / 0.9);
  box-shadow: 0 18px 44px rgb(var(--tc-sh-2563eb) / calc(0.12 * var(--k-sh)));
  backdrop-filter: blur(18px);
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.orion-home-logo:hover {
  transform: translateY(-2px);
  box-shadow: 0 22px 52px rgb(var(--tc-sh-2563eb) / calc(0.18 * var(--k-sh)));
}

.orion-home-logo img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.orion-shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 22px 0 80px;
}

.orion-hero,
.orion-control-panel,
.orion-summary-card,
.orion-focus-card,
.orion-scenario-card,
.orion-timeline-card,
.orion-warning {
  border: 1px solid rgb(var(--tc-bd-bfdbfe) / 0.92);
  background:
    linear-gradient(135deg, rgb(var(--tc-bg-ffffff) / 0.94), rgb(var(--tc-bg-eff8ff) / 0.86)),
    rgb(var(--tc-bg-ffffff) / 0.85);
  box-shadow: 0 28px 90px rgb(var(--tc-sh-2563eb) / calc(0.11 * var(--k-sh)));
  backdrop-filter: blur(22px);
}

.orion-hero {
  border-radius: 30px;
  padding: 40px 36px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 24px;
  align-items: stretch;
}

.orion-hero span,
.orion-control-head span,
.orion-summary-card > span,
.orion-focus-card > span,
.orion-section-head span {
  display: inline-flex;
  color: rgb(var(--tc-tx-2563eb));
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.orion-hero h1 {
  max-width: 760px;
  margin: 14px 0 18px;
  color: rgb(var(--tc-tx-071629));
  font-size: clamp(42px, 6vw, 72px);
  line-height: 0.96;
  letter-spacing: -0.075em;
}

.orion-hero p {
  max-width: 760px;
  margin: 0;
  color: rgb(var(--tc-tx-475569));
  font-size: 16px;
  font-weight: 650;
  line-height: 1.75;
}

.orion-hero aside {
  border-radius: 26px;
  padding: 24px;
  background: rgb(var(--tc-bg-ffffff) / 0.82);
  border: 1px solid rgb(var(--tc-bd-bfdbfe) / 0.85);
}

.orion-hero aside span {
  color: rgb(var(--tc-tx-64748b));
  letter-spacing: 0.12em;
}

.orion-hero aside strong {
  display: block;
  margin-top: 14px;
  color: rgb(var(--tc-tx-071629));
  font-size: 46px;
  line-height: 1;
  letter-spacing: -0.06em;
}

.orion-risk {
  margin-top: 16px;
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  padding: 0 14px;
  border-radius: 999px;
  font-style: normal;
  font-size: 13px;
  font-weight: 950;
}

.orion-risk.low {
  color: rgb(var(--tc-tx-047857));
  background: rgb(var(--tc-bg-d1fae5) / 0.95);
}

.orion-risk.medium {
  color: rgb(var(--tc-tx-92400e));
  background: rgb(var(--tc-bg-fef3c7) / 0.95);
}

.orion-risk.high {
  color: rgb(var(--tc-tx-be123c));
  background: rgb(var(--tc-bg-ffe4e6) / 0.95);
}

.orion-control-panel {
  margin-top: 22px;
  border-radius: 30px;
  padding: 30px;
}

.orion-control-head h2,
.orion-summary-card h2,
.orion-focus-card h2,
.orion-section-head h2 {
  margin: 8px 0 0;
  color: rgb(var(--tc-tx-071629));
  font-size: clamp(28px, 3vw, 42px);
  line-height: 1.05;
  letter-spacing: -0.055em;
}

.orion-control-head p,
.orion-summary-card p,
.orion-section-head p {
  max-width: 760px;
  margin: 10px 0 0;
  color: rgb(var(--tc-tx-64748b));
  font-size: 14px;
  font-weight: 700;
  line-height: 1.7;
}

.orion-form-grid {
  margin-top: 22px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 180px;
  gap: 14px;
}

.orion-form-grid label,
.orion-score-table label {
  display: grid;
  gap: 8px;
}

.orion-form-grid label span,
.orion-score-table label span {
  color: rgb(var(--tc-tx-475569));
  font-size: 12px;
  font-weight: 950;
}

.orion-form-grid input,
.orion-score-table input {
  width: 100%;
  min-height: 48px;
  border: 1px solid rgb(var(--tc-bd-bfdbfe) / 0.95);
  border-radius: 16px;
  padding: 0 14px;
  color: rgb(var(--tc-tx-071629));
  background: rgb(var(--tc-bg-ffffff) / 0.92);
  outline: none;
  font-size: 14px;
  font-weight: 850;
}

.orion-form-grid input:focus,
.orion-score-table input:focus {
  border-color: rgba(37, 99, 235, 0.65);
  box-shadow: 0 0 0 4px rgb(var(--tc-sh-2563eb) / calc(0.08 * var(--k-sh)));
}

.orion-score-table {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.orion-score-table > div {
  padding: 16px;
  border-radius: 20px;
  background: rgb(var(--tc-bg-f8fafc) / 0.92);
  border: 1px solid rgb(var(--tc-bd-e2e8f0) / 0.9);
}

.orion-score-table > div > strong {
  display: block;
  margin-bottom: 12px;
  color: rgb(var(--tc-tx-071629));
  font-size: 15px;
  font-weight: 950;
}

.orion-score-table > div {
  display: grid;
  gap: 12px;
}

.orion-result-grid {

  font-weight: 750;
  line-height: 1.7;
}

.haven-warning {
  margin-top: 22px;
  border-radius: 24px;
  padding: 22px;
  color: rgb(var(--tc-tx-92400e));
  background: rgb(var(--tc-bg-fef3c7) / 0.72);
}

.haven-warning strong {
  display: block;
  font-size: 16px;
  font-weight: 950;
}

@media (max-width: 980px) {
  .haven-hero {
    grid-template-columns: 1fr;
  }

  .haven-form-grid,
  .haven-summary-grid,
  .haven-support-list,
  .haven-scholarship-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .haven-shell,
  .haven-floating-header {
    width: min(100% - 20px, 1180px);
  }

  .haven-hero,
  .haven-control-panel {
    border-radius: 24px;
    padding: 24px;
  }

  .haven-form-grid,
  .haven-summary-grid,
  .haven-support-list,
  .haven-scholarship-grid {
    grid-template-columns: 1fr;
  }

  .haven-hero h1 {
    font-size: 38px;
  }
}

.cognitive-growth-panel {
  display: grid;
  gap: 18px;
  margin-top: 18px;
  padding: 26px;
  border: 1px solid rgba(147,197,253,.28);
  border-radius: 30px;
  background: linear-gradient(135deg,rgb(var(--tc-bg-ffffff)),rgb(var(--tc-bg-f8fbff)));
  box-shadow: 0 20px 60px rgb(var(--tc-sh-0f3c78) / calc(0.08 * var(--k-sh)));
}

.cognitive-growth-header {
  display: grid;
  grid-template-columns: minmax(0,1fr) 180px;
  gap: 20px;
  align-items: center;
}

.cognitive-growth-header > div:first-child > span,
.cognitive-growth-insights span,
.cognitive-growth-meta span,
.cognitive-growth-note > span {
  color: rgb(var(--tc-tx-2563eb));
  font-size: 9px;
  font-weight: 950;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.cognitive-growth-header h3 {
  margin: 7px 0 0;
  color: rgb(var(--tc-tx-071629));
  font-size: clamp(24px,3vw,34px);
  letter-spacing: -.05em;
}

.cognitive-growth-header p {
  max-width: 680px;
  margin: 10px 0 0;
  color: rgb(var(--tc-tx-64748b));
  font-size: 13px;
  line-height: 1.7;
}

.cognitive-growth-overall {
  padding: 18px;
  border-radius: 22px;
  background: #071629;
  color: #fff;
}

.cognitive-growth-overall small {
  display: block;
  color: #94a3b8;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .1em;
}

.cognitive-growth-overall strong {
  display: block;
  margin-top: 7px;
  font-size: 35px;
  letter-spacing: -.06em;
}

.cognitive-growth-overall em {
  font-size: 10px;
  font-style: normal;
  font-weight: 900;
}

.cognitive-growth-overall.is-up em {
  color: #67e8f9;
}

.cognitive-growth-overall.is-down em {
  color: #fca5a5;
}

.cognitive-growth-overall.is-stable em {
  color: #cbd5e1;
}

.cognitive-growth-meta {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.cognitive-growth-meta > div {
  padding: 14px 16px;
  border-radius: 18px;
  background: rgb(var(--tc-bg-eff6ff));
}

.cognitive-growth-meta strong {
  display: block;
  margin-top: 6px;
  color: rgb(var(--tc-tx-071629));
  font-size: 14px;
}

.cognitive-growth-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 12px;
}

.cognitive-growth-grid article {
  padding: 16px;
  border: 1px solid rgb(var(--tc-bd-e2e8f0));
  border-radius: 20px;
  background: rgb(var(--tc-bg-ffffff));
}

.cognitive-growth-card-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.cognitive-growth-card-top span {
  color: rgb(var(--tc-tx-64748b));
  font-size: 10px;
  font-weight: 950;
}

.cognitive-growth-card-top strong {
  display: block;
  margin-top: 5px;
  color: rgb(var(--tc-tx-071629));
  font-size: 24px;
}

.cognitive-growth-card-top b {
  font-size: 13px;
}

.cognitive-growth-card-top b.is-up {
  color: rgb(var(--tc-tx-059669));
}

.cognitive-growth-card-top b.is-down {
  color: rgb(var(--tc-tx-dc2626));
}

.cognitive-growth-card-top b.is-stable {
  color: rgb(var(--tc-tx-64748b));
}

.cognitive-growth-bar {
  height: 7px;
  margin-top: 13px;
  overflow: hidden;
  border-radius: 999px;
  background: rgb(var(--tc-bg-e2e8f0));
}

.cognitive-growth-bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg,#2563eb,rgb(var(--tc-bg-38bdf8)));
}

.cognitive-growth-card-bottom {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}

.cognitive-growth-card-bottom span,
.cognitive-growth-card-bottom em {
  color: #94a3b8;
  font-size: 9px;
  font-style: normal;
  font-weight: 800;
}

.cognitive-growth-insights {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
}

.cognitive-growth-insights article {
  padding: 18px;
  border-radius: 20px;
  background: #071629;
}

.cognitive-growth-insights strong {
  display: block;
  margin-top: 7px;
  color: #f8fafc;
  font-size: 23px;
}

.cognitive-growth-insights p {
  margin: 5px 0 0;
  color: #94a3b8;
  font-size: 10px;
  line-height: 1.5;
}

.cognitive-growth-note {
  padding: 16px 18px;
  border-left: 3px solid rgb(var(--tc-bd-38bdf8));
  border-radius: 0 18px 18px 0;
  background: rgb(var(--tc-bg-eff6ff));
}

.cognitive-growth-note p {
  margin: 6px 0 0;
  color: rgb(var(--tc-tx-475569));
  font-size: 11px;
  line-height: 1.65;
  font-weight: 650;
}

.cognitive-growth-empty {
  padding: 24px;
  border-radius: 22px;
  background: rgb(var(--tc-bg-f8fafc));
}

.cognitive-growth-empty span {
  color: rgb(var(--tc-tx-2563eb));
  font-size: 9px;
  font-weight: 950;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.cognitive-growth-empty h3 {
  margin: 7px 0 0;
  color: rgb(var(--tc-tx-071629));
  font-size: 22px;
}

.cognitive-growth-empty p {
  margin: 8px 0 0;
  color: rgb(var(--tc-tx-64748b));
  font-size: 12px;
}

@media (max-width: 1000px) {
  .cognitive-growth-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}

@media (max-width: 720px) {
  .cognitive-growth-header,
  .cognitive-growth-meta,
  .cognitive-growth-insights {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 520px) {
  .cognitive-growth-grid {
    grid-template-columns: 1fr;
  }
}

.lumen-page {
  min-height: 100vh;
  color: rgb(var(--tc-tx-071629));

  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(37, 99, 235, 0.1),
      transparent 28%
    ),
    radial-gradient(
      circle at 92% 12%,
      rgba(56, 189, 248, 0.08),
      transparent 25%
    ),
    linear-gradient(
      180deg,
      rgb(var(--tc-bg-f8fbff)) 0%,
      rgb(var(--tc-bg-f1f7ff)) 48%,
      rgb(var(--tc-bg-edf5ff)) 100%
    );
}


/* =========================================================
   HEADER
   ========================================================= */

.lumen-floating-header {
  position: sticky;
  top: 0;
  z-index: 50;

  height: 72px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 34px;

  border-bottom:
    1px solid
    rgba(148, 163, 184, 0.14);

  background:
    rgb(var(--tc-bg-f8fbff) / 0.78);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);
}


.lumen-home-logo {
  display: inline-flex;
  align-items: center;

  width: 92px;

  text-decoration: none;

  transition:
    transform 0.2s ease,
    opacity 0.2s ease;
}


.lumen-home-logo:hover {
  transform: translateY(-1px);
  opacity: 0.85;
}


.lumen-home-logo img {
  display: block;

  width: 100%;
  height: auto;
}


/* =========================================================
   MAIN SHELL
   ========================================================= */

.lumen-shell {
  width: min(
    1180px,
    calc(100% - 32px)
  );

  margin: 0 auto;

  padding:
    34px 0 80px;
}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.lumen-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  color: rgb(var(--tc-tx-2563eb));

  font-size: 10px;
  font-weight: 900;

  letter-spacing: 0.17em;

  line-height: 1.2;

  text-transform: uppercase;
}


.lumen-eyebrow::before {
  content: "";

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background:
    rgb(var(--tc-bg-38bdf8));

  box-shadow:
    0 0 0 4px
    rgba(56, 189, 248, 0.1);
}


/* =========================================================
   OVERVIEW / HERO
   ========================================================= */

.lumen-overview-card {
  position: relative;
  overflow: hidden;

  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    250px;

  gap: 34px;

  padding: 42px;

  border:
    1px solid
    rgb(var(--tc-bd-93c5fd) / 0.4);

  border-radius: 32px;

  background:
    rgb(var(--tc-bg-ffffff) / 0.88);

  box-shadow:
    0 30px 90px
    rgb(var(--tc-sh-0f3c78) / calc(0.08 * var(--k-sh))),
    0 4px 20px
    rgb(var(--tc-sh-0f3c78) / calc(0.035 * var(--k-sh)));

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);
}


.lumen-overview-card::before {
  content: "";

  position: absolute;

  width: 420px;
  height: 420px;

  right: -220px;
  top: -230px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(56, 189, 248, 0.15),
      rgba(37, 99, 235, 0.04) 48%,
      transparent 72%
    );

  pointer-events: none;
}


.lumen-overview-card::after {
  content: "";

  position: absolute;

  left: -120px;
  bottom: -180px;

  width: 300px;
  height: 300px;

  border-radius: 50%;

  background:
    rgba(37, 99, 235, 0.045);

  filter:
    blur(28px);

  pointer-events: none;
}


.lumen-overview-copy {
  position: relative;
  z-index: 2;

  display: flex;
  flex-direction: column;

  justify-content: center;
}


.lumen-overview-copy h1 {
  margin:
    14px 0 12px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    clamp(
      38px,
      6vw,
      68px
    );

  line-height:
    0.96;

  font-weight:
    950;

  letter-spacing:
    -0.065em;
}


.lumen-overview-copy p {
  max-width:
    700px;

  margin:
    0;

  color:
    rgb(var(--tc-tx-64748b));

  font-size:
    15px;

  line-height:
    1.8;
}


/* =========================================================
   SCORE ORB
   ========================================================= */

.lumen-score-orb {
  position: relative;
  z-index: 2;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  min-height:
    220px;

  padding:
    24px;

  border:
    1px solid
    rgb(var(--tc-bd-93c5fd) / 0.48);

  border-radius:
    28px;

  background:
    linear-gradient(
      145deg,
      rgb(var(--tc-bg-ffffff)) 0%,
      rgb(var(--tc-bg-f4f9ff)) 55%,
      rgb(var(--tc-bg-eaf4ff)) 100%
    );

  box-shadow:
    inset 0 1px 0
    rgb(var(--tc-hl-ffffff) / 0.9),
    0 18px 45px
    rgb(var(--tc-sh-2563eb) / calc(0.07 * var(--k-sh)));
}


.lumen-score-orb::before {
  content: "";

  position: absolute;

  width: 145px;
  height: 145px;

  border-radius: 50%;

  border:
    1px solid
    rgba(37, 99, 235, 0.1);

  box-shadow:
    0 0 0 12px
    rgb(var(--tc-sh-2563eb) / calc(0.025 * var(--k-sh))),
    0 0 0 24px
    rgba(56, 189, 248, 0.018);

  pointer-events: none;
}


.lumen-score-orb small {
  position: relative;
  z-index: 2;

  color:
    rgb(var(--tc-tx-64748b));

  font-size:
    10px;

  font-weight:
    850;

  letter-spacing:
    0.12em;

  text-transform:
    uppercase;
}


.lumen-score-orb strong {
  position: relative;
  z-index: 2;

  margin-top:
    8px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    58px;

  line-height:
    1;

  font-weight:
    950;

  letter-spacing:
    -0.07em;
}


.lumen-score-orb span {
  position: relative;
  z-index: 2;

  margin-top:
    8px;

  color:
    #94a3b8;

  font-size:
    11px;

  font-weight:
    700;
}


/* =========================================================
   GENERIC PANEL
   ========================================================= */

.lumen-panel {
  position: relative;

  margin-top:
    22px;

  padding:
    30px;

  border:
    1px solid
    rgb(var(--tc-bd-bfdbfe) / 0.9);

  border-radius:
    28px;

  background:
    rgb(var(--tc-bg-ffffff) / 0.9);

  box-shadow:
    0 20px 55px
    rgb(var(--tc-sh-0f3c78) / calc(0.055 * var(--k-sh)));

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);
}


.lumen-panel-heading {
  margin-bottom:
    24px;
}


.lumen-panel-heading h2,
.lumen-evidence-card h2 {
  margin:
    10px 0 8px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    28px;

  line-height:
    1.12;

  font-weight:
    950;

  letter-spacing:
    -0.05em;
}


.lumen-panel-heading p {
  max-width:
    760px;

  margin:
    0;

  color:
    rgb(var(--tc-tx-64748b));

  font-size:
    14px;

  line-height:
    1.75;
}


/* =========================================================
   COGNITIVE DIMENSIONS
   ========================================================= */

.lumen-dimension-grid {
  display:
    grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap:
    12px;
}


.lumen-dimension-card {
  position: relative;

  min-height:
    124px;

  padding:
    20px;

  overflow:
    hidden;

  border:
    1px solid
    rgb(var(--tc-bd-dbeafe));

  border-radius:
    20px;

  background:
    linear-gradient(
      145deg,
      rgb(var(--tc-bg-ffffff)),
      rgb(var(--tc-bg-f7fbff))
    );

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}


.lumen-dimension-card:hover {
  transform:
    translateY(-2px);

  border-color:
    rgb(var(--tc-bd-bfdbfe));

  box-shadow:
    0 14px 30px
    rgb(var(--tc-sh-2563eb) / calc(0.07 * var(--k-sh)));
}


.lumen-dimension-card strong {
  display:
    block;

  margin-top:
    17px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    27px;

  line-height:
    1;

  font-weight:
    950;

  letter-spacing:
    -0.04em;
}


.lumen-meter {
  height:
    5px;

  margin-top:
    15px;

  overflow:
    hidden;

  border-radius:
    999px;

  background:
    rgb(var(--tc-bg-e8f0fa));
}


.lumen-meter i {
  display:
    block;

  height:
    100%;

  min-width:
    3px;

  border-radius:
    inherit;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      rgb(var(--tc-bg-38bdf8))
    );
}


/* =========================================================
   INSIGHT GRID
   ========================================================= */

.lumen-insight-grid {
  display:
    grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap:
    14px;

  margin-top:
    20px;
}


.lumen-insight-card {
  padding:
    22px;

  border:
    1px solid
    rgb(var(--tc-bd-dbeafe));

  border-radius:
    22px;

  background:
    linear-gradient(
      145deg,
      rgb(var(--tc-bg-ffffff)),
      rgb(var(--tc-bg-f8fbff))
    );

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}


.lumen-insight-card:hover {
  transform:
    translateY(-2px);

  box-shadow:
    0 16px 35px
    rgb(var(--tc-sh-0f3c78) / calc(0.06 * var(--k-sh)));
}


.lumen-insight-card h3 {
  margin:
    12px 0 8px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    18px;

  line-height:
    1.25;

  font-weight:
    900;

  letter-spacing:
    -0.025em;
}


.lumen-insight-card p {
  margin:
    0;

  color:
    rgb(var(--tc-tx-64748b));

  font-size:
    13px;

  line-height:
    1.65;
}


.lumen-card-tag {
  display:
    inline-flex;

  align-items:
    center;

  min-height:
    26px;

  padding:
    0 9px;

  border:
    1px solid
    rgb(var(--tc-bd-bfdbfe));

  border-radius:
    999px;

  color:
    rgb(var(--tc-tx-2563eb));

  background:
    rgb(var(--tc-bg-eff6ff));

  font-size:
    9px;

  font-weight:
    900;

  letter-spacing:
    0.1em;
}


/* =========================================================
   DECISION
   ========================================================= */

.lumen-decision-grid {
  display:
    grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap:
    14px;
}


.lumen-decision-card {
  min-height:
    150px;

  padding:
    22px;

  border:
    1px solid
    rgb(var(--tc-bd-dbeafe));

  border-radius:
    22px;

  background:
    linear-gradient(
      145deg,
      rgb(var(--tc-bg-ffffff)),
      rgb(var(--tc-bg-f8fbff))
    );

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}


.lumen-decision-card:hover {
  transform:
    translateY(-2px);

  border-color:
    rgb(var(--tc-bd-bfdbfe));

  box-shadow:
    0 15px 35px
    rgb(var(--tc-sh-2563eb) / calc(0.055 * var(--k-sh)));
}


.lumen-decision-card.is-wide {
  grid-column:
    1 / -1;

  min-height:
    auto;
}


.lumen-decision-card > span {
  display:
    inline-flex;

  color:
    rgb(var(--tc-tx-2563eb));

  font-size:
    10px;

  font-weight:
    900;

  text-transform:
    uppercase;

  letter-spacing:
    0.12em;
}


.lumen-decision-card strong {
  display:
    block;

  margin-top:
    14px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    28px;

  line-height:
    1.15;

  font-weight:
    950;

  letter-spacing:
    -0.045em;
}


.lumen-decision-card p {
  margin:
    12px 0 0;

  color:
    rgb(var(--tc-tx-64748b));

  line-height:
    1.65;

  font-size:
    13px;
}


.lumen-decision-card ul {
  margin:
    13px 0 0;

  padding-left:
    19px;
}


.lumen-decision-card li {
  margin-bottom:
    8px;

  color:
    rgb(var(--tc-tx-475569));

  font-size:
    13px;

  line-height:
    1.6;
}


.lumen-decision-card li:last-child {
  margin-bottom:
    0;
}


/* =========================================================
   EVIDENCE
   ========================================================= */

.lumen-evidence-card {
  display:
    grid;

  grid-template-columns:
    minmax(0, 0.8fr)
    minmax(0, 1.2fr);

  gap:
    30px;

  margin-top:
    22px;

  padding:
    30px;

  border:
    1px solid
    rgb(var(--tc-bd-dbeafe));

  border-radius:
    28px;

  background:
    rgb(var(--tc-bg-ffffff) / 0.94);

  box-shadow:
    0 18px 50px
    rgb(var(--tc-sh-0f3c78) / calc(0.045 * var(--k-sh)));
}


.lumen-evidence-card h2 {
  margin-top:
    10px;
}


.lumen-evidence-list {
  display:
    grid;

  gap:
    10px;
}


.lumen-evidence-list > div {
  display:
    grid;

  grid-template-columns:
    10px minmax(0, 1fr) auto;

  align-items:
    center;

  gap:
    12px;

  min-height:
    52px;

  padding:
    0 15px;

  border:
    1px solid

  border-radius:
    15px;

  background:
    rgb(var(--tc-bg-fbfdff));

.lumen-evidence-list i {

    7px;

  height:
    7px;

  border-radius:
    50%;

  background:
    rgb(var(--tc-bg-94a3b8));
}


.lumen-evidence-list i.is-on {
  background:
    rgb(var(--tc-bg-22c55e));

    0 0 0 4px

/* =========================================================

   ========================================================= */

.lumen-ai-explanation {
  margin-top:
    26px;
}


.lumen-ai-explanation h2 {
  margin:
    10px 0 14px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    24px;

  line-height:
    1.2;

  font-weight:
    950;

  letter-spacing:
    -0.04em;
}


.lumen-ai-explanation-card {
  padding:
    20px 22px;

  border:
    1px solid
    rgb(var(--tc-bd-dbeafe));

  border-radius:
    20px;

  background:
    linear-gradient(
      145deg,
      rgb(var(--tc-bg-f8fbff)),
      rgb(var(--tc-bg-ffffff))
    );
}


.lumen-ai-explanation-card p,
.lumen-ai-explanation-card li {
  color:
    rgb(var(--tc-tx-475569));

  font-size:
    13px;

  line-height:
    1.7;
}


.lumen-ai-explanation-card ul {
  margin:
    0;

  padding-left:
    20px;
}


.lumen-ai-explanation-card li {
  margin-bottom:
    8px;
}


/* =========================================================
   STRATEGY / ORION
   ========================================================= */

.lumen-panel .lumen-insight-grid + .lumen-ai-explanation {
  margin-top:
    30px;
}


.lumen-strategy-highlight {
  position:
    relative;

  overflow:
    hidden;

  padding:
    24px;

  border:
    1px solid
    rgb(var(--tc-bd-93c5fd) / 0.5);

  border-radius:
    24px;

  background:
    linear-gradient(
      135deg,
      rgb(var(--tc-bg-f8fbff)),
      rgb(var(--tc-bg-eff6ff))
    );
}


.lumen-strategy-highlight::after {
  content: "";

  position: absolute;

  width:
    180px;

  height:
    180px;

  right:
    -80px;

  top:
    -90px;

  border-radius:
    50%;

  background:
    rgba(56, 189, 248, 0.1);

  filter:
    blur(8px);
}


/* =========================================================
   EMPTY / ERROR
   ========================================================= */

.lumen-empty-card,
.lumen-error-card {
  position:
    relative;

  overflow:
    hidden;

  padding:
    58px 40px;

  text-align:
    center;

  border:
    1px solid
    rgb(var(--tc-bd-dbeafe));

  border-radius:
    30px;

  background:
    rgb(var(--tc-bg-ffffff) / 0.92);

  box-shadow:
    0 25px 70px
    rgb(var(--tc-sh-0f3c78) / calc(0.06 * var(--k-sh)));
}


.lumen-empty-icon {
  width:
    62px;

  height:
    62px;

  margin:
    0 auto 20px;

  display:
    grid;

  place-items:
    center;

  border:
    1px solid
    rgb(var(--tc-bd-bfdbfe));

  border-radius:
    20px;

  background:
    rgb(var(--tc-bg-eff6ff));

  color:
    rgb(var(--tc-tx-2563eb));

  font-size:
    24px;

  box-shadow:
    0 10px 30px
    rgb(var(--tc-sh-2563eb) / calc(0.08 * var(--k-sh)));
}


.lumen-empty-card h1,
.lumen-error-card h1 {
  margin:
    12px 0 8px;

  color:
    rgb(var(--tc-tx-071629));

  font-size:
    30px;

  font-weight:
    950;

  letter-spacing:
    -0.045em;
}


.lumen-empty-card p,
.lumen-error-card p {
  max-width:
    560px;

  margin:
    0 auto;

  color:
    rgb(var(--tc-tx-64748b));

  font-size:
    14px;

  line-height:
    1.7;
}


.lumen-primary-action {
  display:
    inline-flex;

  align-items:
    center;
  justify-content:
    center;

  margin-top:
    24px;

  min-height:
    44px;

  padding:
    0 22px;

  border:
    1px solid
    #2563eb;

  border-radius:
    14px;

  color:
    #ffffff;

  background:
    #2563eb;

  text-decoration:
    none;

  font-size:
    13px;

  font-weight:
    850;

  box-shadow:
    0 10px 25px
    rgb(var(--tc-sh-2563eb) / calc(0.18 * var(--k-sh)));

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}


.lumen-primary-action:hover {
  transform:
    translateY(-2px);

  background:
    #1d4ed8;

  box-shadow:
    0 14px 30px
    rgb(var(--tc-sh-2563eb) / calc(0.22 * var(--k-sh)));
}


/* =========================================================
   LOADING
   ========================================================= */

.lumen-page-loading {
  min-height:
    70vh;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  gap:
    16px;

  color:
    rgb(var(--tc-tx-475569));
}


.lumen-page-loading strong {
  font-size:
    13px;

  font-weight:
    800;
}


.lumen-loading-orb {
  position:
    relative;

  width:
    64px;

  height:
    64px;

  border:
    2px solid
    rgba(37, 99, 235, 0.18);

  border-top-color:
    #2563eb;

  border-radius:
    50%;

  animation:
    lumenSpin
    1s
    linear
    infinite;
}


.lumen-loading-orb::after {
  content: "";

  position:
    absolute;

  inset:
    9px;

  border:
    1px solid
    rgba(56, 189, 248, 0.25);

  border-radius:
    50%;
}


@keyframes lumenSpin {

  to {
    transform:
      rotate(360deg);
  }

}


/* =========================================================
   FOOTER
   ========================================================= */

.lumen-footer {
  display:
    flex;

  align-items:
    flex-end;

  justify-content:
    space-between;

  gap:
    20px;

  margin-top:
    32px;

  padding:
    0 4px;

  color:
    rgb(var(--tc-tx-64748b));

  font-size:
    11px;
}


.lumen-footer div {
  display:
    flex;

  flex-direction:
    column;

  gap:
    4px;
}


.lumen-footer strong {
  color:
    rgb(var(--tc-tx-2563eb));

  font-size:
    10px;

  font-weight:
    950;

  letter-spacing:
    0.14em;
}


.lumen-footer span {
  color:
    #94a3b8;

  font-size:
    9px;

  font-weight:
    800;

  letter-spacing:
    0.12em;
}


.lumen-footer small {
  color:
    #94a3b8;

  font-size:
    10px;

  font-weight:
    700;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 1000px) {

  .lumen-overview-card {
    grid-template-columns:
      1fr 210px;

    gap:
      24px;

    padding:
      32px;
  }


  .lumen-dimension-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }


  .lumen-insight-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 760px) {

  .lumen-floating-header {
    height:
      64px;

    padding:
      0 18px;
  }


  .lumen-home-logo {
    width:
      80px;
  }


  .lumen-shell {
    width:
      calc(100% - 24px);

    padding:
      22px 0 60px;
  }


  .lumen-overview-card {
    grid-template-columns:
      1fr;

    gap:
      24px;

    padding:
      26px;

    border-radius:
      26px;
  }


  .lumen-overview-copy h1 {
    font-size:
      clamp(
        38px,
        13vw,
        56px
      );
  }


  .lumen-overview-copy p {
    font-size:
      14px;
  }


  .lumen-score-orb {
    min-height:
      180px;
  }


  .lumen-score-orb strong {
    font-size:
      52px;
  }


  .lumen-panel {
    padding:
      24px;

    border-radius:
      24px;
  }


  .lumen-panel-heading h2,
  .lumen-evidence-card h2 {
    font-size:
      25px;
  }


  .lumen-decision-grid {
    grid-template-columns:
      1fr;
  }


  .lumen-decision-card.is-wide {
    grid-column:
      auto;
  }


  .lumen-evidence-card {
    grid-template-columns:
      1fr;

    padding:
      24px;

    gap:
      22px;
  }


  .lumen-insight-grid {
    grid-template-columns:
      1fr;
  }


  .lumen-footer {
    flex-direction:
      column;

    align-items:
      flex-start;
  }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 480px) {

  .lumen-floating-header {
    padding:
      0 14px;
  }


  .lumen-shell {
    width:
      calc(100% - 20px);
  }


  .lumen-overview-card,
  .lumen-panel,
  .lumen-evidence-card {
    padding:
      20px;
  }


  .lumen-dimension-grid {
    grid-template-columns:
      1fr;
  }


  .lumen-dimension-card {
    min-height:
      112px;
  }


  .lumen-decision-card {
    min-height:
      135px;

    padding:
      19px;
  }


  .lumen-empty-card,
  .lumen-error-card {
    padding:
      42px 22px;
  }


  .lumen-empty-card h1,
  .lumen-error-card h1 {
    font-size:
      26px;
  }

}


/* =========================================================
   ACCESSIBILITY
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .lumen-home-logo,
  .lumen-dimension-card,
  .lumen-insight-card,
  .lumen-decision-card,
  .lumen-primary-action {
    transition:
      none;
  }


  .lumen-loading-orb {
    animation:
      none;
  }

}

/*
 * Cognitive Learn AI — unified visual system (CP28)
 * One light application canvas, white/pale-blue surfaces, CLA blue accents,
 * and one consistent deep-blue hero treatment. Dark surfaces are reserved
 * for branded hero panels and code/diagnostic output only.
 */
:root {
  --ink: #0b2342;
  --blue: #2563eb;
  --blue-2: #38bdf8;
  --line: #d7e6f8;
  --muted: #61758f;
  --sheet: #ffffff;
  --paper: #f3f8ff;
  --shadow: 0 22px 60px rgba(23, 73, 145, .10);
  --cla-ink: #0b2342;
  --cla-ink-soft: #294565;
  --cla-muted: #627893;
  --cla-blue: #2563eb;
  --cla-cyan: #38bdf8;
  --cla-border: #d7e6f8;
  --cla-surface: #ffffff;
  --cla-surface-soft: #f3f8ff;
  --cla-page: #eef5ff;
  --cla-hero: linear-gradient(132deg, #0c2d73 0%, #1749a5 56%, #176fc0 100%);
  --cla-card-shadow: 0 16px 42px rgba(23, 73, 145, .08);
}

html, body, #root, .app-root { min-height: 100%; }
body {
  color: var(--cla-ink);
  background:
    radial-gradient(circle at 8% 8%, rgba(37, 99, 235, .07), transparent 28%),
    radial-gradient(circle at 94% 12%, rgba(56, 189, 248, .10), transparent 25%),
    linear-gradient(135deg, rgb(var(--tc-bg-f8fbff)) 0%, var(--cla-page) 55%, rgb(var(--tc-bg-fbfdff)) 100%);
}

/* Consistent branded hero treatment across the product. */
.profile-showcase-left,
.admin-switcher,
.role-landing,
.student-hero,
.student-panel.dark,
.profile-head,
.student-intelligence-hero,
.student-dash-hero,
.module-detail-panel,
.module-path-detail,
.about-hero-premium,
.contact-hero-premium,
.about-identity-grid article.featured,
.nexus-hero,
.cognitive-growth-overall {
  background: var(--cla-hero) !important;
}
.profile-showcase-card {
  background: linear-gradient(155deg, #1749a5 0%, #10377f 100%) !important;
}
.student-intelligence-hero,
.student-dash-hero,
.nexus-hero,
.module-detail-panel,
.module-path-detail,
.role-landing,
.admin-switcher,
.about-hero-premium,
.contact-hero-premium {
  box-shadow: 0 22px 58px rgb(var(--tc-sh-0d377d) / calc(0.16 * var(--k-sh)));
}

/* Nexus rail now follows the same light workspace system, not a separate dark theme. */
.nexus-page {
  background: var(--cla-page) !important;
  grid-template-columns: 292px minmax(0, 1fr);
}
.nexus-rail {
  background: linear-gradient(180deg, #f8fbff 0%, #edf5ff 100%) !important;
  color: var(--cla-ink) !important;
  border-right: 1px solid var(--cla-border);
  box-shadow: 8px 0 28px rgb(var(--tc-sh-174991) / calc(0.045 * var(--k-sh)));
}
.nexus-brand {
  background: rgb(var(--tc-bg-ffffff)) !important;
  border: 1px solid var(--cla-border) !important;
  box-shadow: 0 10px 28px rgb(var(--tc-sh-174991) / calc(0.06 * var(--k-sh)));
}
.nexus-brand span { color: var(--cla-blue) !important; }
.nexus-brand strong { color: var(--cla-ink) !important; }
.nexus-cluster-list::before {
  background: linear-gradient(180deg, transparent, rgba(37, 99, 235, .25), transparent) !important;
}
.nexus-cluster-button {
  background: rgb(var(--tc-bg-ffffff) / 0.88) !important;
  color: var(--cla-ink) !important;
  border: 1px solid var(--cla-border) !important;
  box-shadow: 0 7px 20px rgb(var(--tc-sh-174991) / calc(0.045 * var(--k-sh))) !important;
}
.nexus-cluster-button:hover,
.nexus-cluster-button.active {
  background: linear-gradient(135deg, rgb(var(--tc-bg-eaf4ff)), rgb(var(--tc-bg-ffffff))) !important;
  border-color: rgb(var(--tc-bd-9fc7fa)) !important;
  box-shadow: 0 12px 28px rgb(var(--tc-sh-2563eb) / calc(0.1 * var(--k-sh))) !important;
}
.nexus-cluster-copy strong { color: var(--cla-ink) !important; }
.nexus-cluster-copy p { color: var(--cla-muted) !important; }
.nexus-rail .user-nav { margin-top: auto; justify-content: center; flex-wrap: wrap; gap: 14px; }
.nexus-rail .user-nav-link small { color: rgb(var(--tc-tx-526b89)) !important; }

.nexus-rail .user-nav-icon,
.nexus-rail .user-nav-avatar {

}
.nexus-rail .user-nav-link.admin-top-link .user-nav-icon {
  background: linear-gradient(135deg, var(--cla-blue), var(--cla-cyan)) !important;

}

/* Role identity is visible in the account menu; it is read from Firestore. */
.user-dropdown-head > div:last-child { min-width: 0; }
.user-role-badge {

/* Explicit role selector on the sign-in/register card. */
.role-selector { margin: 26px 0 22px; }

/* Admin role preview: separate from the admin module directory and clearly read-only. */
.nexus-role-switcher {
  margin-top: 22px;

  border: 1px solid var(--cla-border);
  border-radius: 28px;
  background: linear-gradient(145deg, rgb(var(--tc-bg-ffffff)) 0%, rgb(var(--tc-bg-f6faff)) 100%);
  box-shadow: var(--cla-card-shadow);
}
.nexus-role-switcher-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}
.nexus-role-switcher-head > div { min-width: 0; }
.nexus-role-switcher-head > div > span {
  color: var(--cla-blue);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .12em;
}
.nexus-role-switcher-head h2 {
  margin: 7px 0 8px;

  font-size: clamp(22px, 2.5vw, 30px);

}

  max-width: 820px;
  margin: 0;
  color: var(--cla-muted);
  font-size: 13px;
  line-height: 1.65;
}
.nexus-role-preview-note {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid rgb(var(--tc-bd-c9defb));
  border-radius: 999px;
  background: rgb(var(--tc-bg-eaf4ff));
  color: rgb(var(--tc-tx-1e55a4));
  font-size: 11px;
  font-weight: 900;
}
.nexus-role-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.nexus-role-card {
  display: grid;
  grid-template-columns: 46px minmax(0,1fr) auto;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 15px;
  border: 1px solid var(--cla-border);
  border-radius: 18px;
  background: rgb(var(--tc-bg-ffffff));
  color: var(--cla-ink);
  text-decoration: none;
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.nexus-role-card:hover,
.nexus-role-card.is-current {
  border-color: rgb(var(--tc-bd-9fc7fa));

  box-shadow: 0 10px 24px rgb(var(--tc-sh-2563eb) / calc(0.09 * var(--k-sh)));

}
.nexus-role-avatar {
  display: grid;
  width: 46px;
  height: 46px;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg, rgb(var(--tc-bg-e7f2ff)), rgb(var(--tc-bg-d9edff)));
  border: 1px solid rgb(var(--tc-bd-c9defb));
  color: rgb(var(--tc-tx-1c57a8));

  font-weight: 950;
}

/* Pulse Admin: evidence circuit visualizes source status without implying a completed workflow. */

.pulse-circuit-details { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; }

}

.cla-source-cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }

.cla-source-year-row > small { color: var(--cla-muted); font-size: 11px; line-height: 1.5; }
@media (max-width: 820px) {
  .cla-source-cards { grid-template-columns: 1fr; }
  .cla-source-registry-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

/* CP42 national discovery: visible on the actual student routes. */

.cla-national-year-strip small,.cla-national-discovery-note {font-size:.8rem;line-height:1.5;}

.cla-focus-nav .cla-module-subnav-links a:hover,.cla-focus-nav .cla-module-subnav-links a:focus-visible{color:rgb(var(--tc-tx-1c5fb2));transform:none;background:transparent;outline-offset:2px}
.cla-focus-heading{margin-top:20px}

.cla-focus-disclosure{margin:14px 0;border:1px solid var(--cla-border,rgb(var(--tc-bd-d7e6f8)));background:rgb(var(--tc-bg-ffffff));border-radius:12px;padding:14px 18px;min-width:0}
.cla-focus-disclosure>summary{cursor:pointer;color:rgb(var(--tc-tx-24558f));font-size:14px;font-weight:750;line-height:1.5}

.cla-focus-notice{font-size:13px;line-height:1.65;border-left:3px solid rgb(var(--tc-bd-70a5db));padding:8px 12px;color:rgb(var(--tc-tx-405d7c));margin:12px 0}
.cla-focus-notice a{color:rgb(var(--tc-tx-175aab));font-weight:750}
.cla-study-columns.cla-study-focused{grid-template-columns:minmax(0,1fr)}
