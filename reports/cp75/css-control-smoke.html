/* Existing design system palette, mobile readable and no horizontally clipped tabs. */
@media(max-width:640px){.cla-module-subnav.cla-focus-nav{margin:8px 0 18px;padding:0 0 10px}.cla-focus-nav .cla-module-subnav-links{gap:3px 12px}.cla-focus-nav .cla-module-subnav-links a{font-size:12px;min-height:44px;padding:10px 2px}.cla-focus-nav .cla-module-subnav-head{align-items:flex-start;flex-wrap:wrap}.cla-focus-disclosure{padding:12px}.cla-focus-heading h1{font-size:24px}}
.cla-workflow-tabs{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 0 6px;border-bottom:1px solid var(--cla-border,rgb(var(--tc-bd-d7e6f8)));margin:8px 0 16px}
.cla-workflow-tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;font-weight:700;color:rgb(var(--tc-tx-4b627e));min-height:44px;padding:10px 4px;cursor:pointer}
.cla-workflow-tabs button[aria-pressed="true"]{color:rgb(var(--tc-tx-1c5fb2));border-color:#2778d5;font-weight:850}
.cla-focus-text-button{background:none;border:0;padding:3px;color:rgb(var(--tc-tx-175aab));text-decoration:underline;cursor:pointer;font-weight:750;font:inherit}
.student-dash .student-dash-module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;border:1px solid var(--cla-border,rgb(var(--tc-bd-d7e6f8)));border-radius:16px;background:rgb(var(--tc-bg-ffffff));padding:5px 16px}
.student-dash .student-dash-module-grid .student-dash-module{display:grid;grid-template-columns:42px minmax(0,1fr) 20px;align-items:center;gap:12px;min-height:88px;padding:12px 0;border:0;border-bottom:1px solid rgb(var(--tc-bd-e6eef9));border-radius:0;background:transparent;box-shadow:none;transform:none}
.student-dash .student-dash-module-grid .student-dash-module:hover{background:rgb(var(--tc-bg-f4f9ff));transform:none}
.student-dash .student-dash-module-grid .student-dash-module-icon{width:42px;height:42px;min-width:0;background:transparent;border:0;box-shadow:none}
.student-dash .student-dash-module-grid .student-dash-module-icon img{width:100%;height:100%;object-fit:contain}
.cla-focus-module-copy{display:grid;gap:4px;min-width:0;line-height:1.4;color:rgb(var(--tc-tx-4b627e));font-size:12px}
.cla-focus-module-copy small{font-size:10px;color:rgb(var(--tc-tx-617b99))}.cla-focus-module-copy strong{font-size:15px;color:rgb(var(--tc-tx-0c2648))}.cla-focus-module-arrow{font-size:18px;color:rgb(var(--tc-tx-2675bd))}
@media(max-width:760px){.student-dash .student-dash-module-grid{grid-template-columns:1fr}.student-dash .student-dash-module-grid .student-dash-module{min-height:80px}.cla-workflow-tabs{gap:6px 12px}}

/* CP36 P1: Task-first navigation and source-grounded scholarship research.
 * Shared CLA light-theme palette; accessible typography and mobile layout. */
.cla-task-hub { max-width: 1200px; padding-bottom: 64px; }
.cla-task-back { padding: 12px 0 18px; }
.cla-task-back a { color: rgb(var(--tc-tx-1d4fa1)); font-weight: 800; text-decoration: none; }
.cla-task-head {
  padding: clamp(22px, 4vw, 42px);
  border: 1px solid rgb(var(--tc-bd-cddff7));
  border-radius: 24px;
  background: linear-gradient(120deg, rgb(var(--tc-bg-e9f3ff)) 0%, rgb(var(--tc-bg-f7fbff)) 68%, rgb(var(--tc-bg-ebf5ff)) 100%);
  box-shadow: 0 16px 40px rgb(var(--tc-sh-194684) / calc(0.07 * var(--k-sh)));
}
.cla-task-head > span, .cla-scholarship-heading > div > span {
  color: rgb(var(--tc-tx-1d56a4)); font-size: 11px; font-weight: 900; letter-spacing: .11em;
}
.cla-task-head h1 { margin: 10px 0; color: rgb(var(--tc-tx-0b294a)); font-size: clamp(28px, 4vw, 39px); line-height: 1.15; }
.cla-task-head p { max-width: 700px; color: rgb(var(--tc-tx-365572)); font-size: 15px; line-height: 1.65; }
.cla-task-head label { display: block; margin: 20px 0 7px; color: rgb(var(--tc-tx-193f6b)); font-size: 13px; font-weight: 850; }
.cla-task-head input {
  display: block; width: 100%; min-height: 48px;
  border: 1px solid rgb(var(--tc-bd-9fc3ec)); border-radius: 13px; background: rgb(var(--tc-bg-ffffff));
  color: rgb(var(--tc-tx-0c2645)); font: inherit; font-size: 15px; padding: 11px 14px;
}
.cla-task-filters { display: flex; gap: 9px; flex-wrap: wrap; margin: 20px 0 12px; }
.cla-task-filters button {
  padding: 10px 15px; border: 1px solid rgb(var(--tc-bd-cddff3)); border-radius: 999px;
  color: rgb(var(--tc-tx-285176)); background: rgb(var(--tc-bg-f6faff)); font-size: 13px; font-weight: 800; cursor: pointer;
}
.cla-task-filters button.is-active { background: #195dba; color: #fff; border-color: #195dba; }
.cla-task-count { margin: 8px 0 16px; color: rgb(var(--tc-tx-536a83)); font-size: 13px; font-weight: 700; }
.cla-task-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cla-task-result {
  min-height: 150px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
  border: 1px solid rgb(var(--tc-bd-d3e2f4)); border-radius: 18px; background: rgb(var(--tc-bg-ffffff));
  padding: 19px; box-shadow: 0 8px 25px rgb(var(--tc-sh-123a69) / calc(0.035 * var(--k-sh)));
}
.cla-task-result > div { min-width: 0; }
.cla-task-category { color: rgb(var(--tc-tx-1d64b6)); font-size: 10px; font-weight: 900; letter-spacing: .055em; text-transform: uppercase; }
.cla-task-result h2 { margin: 6px 0 7px; font-size: 17px; line-height: 1.25; color: rgb(var(--tc-tx-102b4b)); }
.cla-task-result p { margin: 0 0 7px; color: rgb(var(--tc-tx-405a73)); font-size: 13px; line-height: 1.5; }
.cla-task-result small { font-size: 11px; color: rgb(var(--tc-tx-806225)); font-weight: 750; }
.cla-task-result > a {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 13px; min-height: 42px;
  border-radius: 12px; background: rgb(var(--tc-bg-edf5ff)); color: rgb(var(--tc-tx-1b56a5));
  font-size: 12px; font-weight: 900; text-decoration: none;
}
.cla-task-result > a:hover { background: rgb(var(--tc-bg-dcecff)); }
.cla-task-disabled { font-size: 12px; color: rgb(var(--tc-tx-6f8194)); font-weight: 800; }
.cla-task-empty { grid-column: 1/-1; padding: 24px; border: 1px dashed rgb(var(--tc-bd-9bbad9)); border-radius: 16px; background: rgb(var(--tc-bg-ffffff)); }
.cla-task-empty button { color: rgb(var(--tc-tx-174f9c)); border: 0; background: transparent; font-weight: 850; cursor: pointer; }

.cla-scholarship-explorer { margin-top: 22px; padding-top: 18px; border-top: 1px solid rgb(var(--tc-bd-d8e6f5)); }
.cla-scholarship-heading { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.cla-scholarship-heading > div:first-child { max-width: 740px; }
.cla-scholarship-heading h2 { color: rgb(var(--tc-tx-102b4a)); font-size: clamp(21px, 3vw, 28px); line-height: 1.25; margin: 8px 0; }
.cla-scholarship-heading p { color: rgb(var(--tc-tx-34536f)) !important; font-size: 14px; line-height: 1.6; }
.cla-scholarship-summary {
  display: grid; justify-items: center; min-width: 130px; padding: 14px 16px; border-radius: 16px;
  color: rgb(var(--tc-tx-0d3876)); border: 1px solid rgb(var(--tc-bd-c4dcf5)); background: rgb(var(--tc-bg-eaf3ff));
}
.cla-scholarship-summary strong { font-size: 32px !important; color: rgb(var(--tc-tx-144e9e)) !important; line-height: 1.1; }
.cla-scholarship-summary span { font-size: 11px; font-weight: 850; text-align: center; }
.cla-scholarship-controls { display: grid; grid-template-columns: minmax(0,1fr) minmax(170px, 260px); gap: 12px; margin: 18px 0; }
.cla-scholarship-controls label { display: grid; gap: 6px; color: rgb(var(--tc-tx-254866)); font-size: 12px; font-weight: 850; }
.cla-scholarship-controls input, .cla-scholarship-controls select { width: 100%; min-height: 44px; padding: 9px 12px; background: rgb(var(--tc-bg-ffffff)); border: 1px solid rgb(var(--tc-bd-bdd3ed)); border-radius: 10px; color: rgb(var(--tc-tx-142e4b)); }
.cla-scholarship-track { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cla-scholarship-track > div { display: grid; gap: 3px; padding: 14px; border: 1px solid rgb(var(--tc-bd-dae6f3)); border-radius: 13px; background: rgb(var(--tc-bg-f4f9ff)); }
.cla-scholarship-track strong { color: rgb(var(--tc-tx-174c97)) !important; font-size: 23px !important; line-height: 1.1; }
.cla-scholarship-track small { color: rgb(var(--tc-tx-526981)); font-size: 11px; line-height: 1.4; }
.cla-scholarship-hint { color: rgb(var(--tc-tx-49647e)) !important; margin: 15px 0 !important; font-size: 12px; line-height: 1.6; }
.cla-scholarship-list { display: grid; gap: 13px; }
.cla-scholarship-item { padding: 20px; border: 1px solid rgb(var(--tc-bd-d7e4f4)); border-radius: 16px; background: rgb(var(--tc-bg-ffffff)); box-shadow: 0 7px 20px rgb(var(--tc-sh-184173) / calc(0.04 * var(--k-sh))); }
.cla-scholarship-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.cla-scholarship-country { color: rgb(var(--tc-tx-1f66ab)); font-size: 11px; font-weight: 900; }
.cla-scholarship-item h3 { color: rgb(var(--tc-tx-0f2949)); font-size: 18px; margin: 5px 0; line-height: 1.3; }
.cla-scholarship-item p { color: rgb(var(--tc-tx-405975)) !important; font-size: 13px; line-height: 1.6; }
.cla-scholarship-state { display: inline-flex; flex: 0 0 auto; border-radius: 999px; padding: 6px 9px; background: rgb(var(--tc-bg-e7f2ff)); color: rgb(var(--tc-tx-164f9b)); font-size: 11px; font-weight: 850; }
.cla-scholarship-state.is-archive { background: rgb(var(--tc-bg-fff3db)); color: rgb(var(--tc-tx-875d0b)); }
.cla-scholarship-source { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; padding: 11px; background: rgb(var(--tc-bg-f3f8ff)); border: 1px solid rgb(var(--tc-bd-e0ebfa)); border-radius: 11px; font-size: 12px; }
.cla-scholarship-source strong { font-size: 12px !important; }
.cla-scholarship-source a { color: rgb(var(--tc-tx-165baf)); font-weight: 850; text-decoration: underline; }
.cla-scholarship-source span { font-size: 11px; color: rgb(var(--tc-tx-5d7391)); margin-left: auto; }
.cla-scholarship-expand { min-height: 40px; margin-top: 13px; padding: 9px 13px; border: 1px solid rgb(var(--tc-bd-bfdbf7)); border-radius: 11px; background: rgb(var(--tc-bg-eef5ff)); color: rgb(var(--tc-tx-164a95)); font-weight: 850; font-size: 12px; cursor: pointer; }
.cla-scholarship-details { margin-top: 14px; border-top: 1px dashed rgb(var(--tc-bd-bad1eb)); padding-top: 10px; }
.cla-scholarship-details h4 { color: rgb(var(--tc-tx-1a466f)); font-size: 14px; margin: 14px 0 7px; }
.cla-scholarship-details li { color: rgb(var(--tc-tx-2f4b67)); font-size: 13px; line-height: 1.6; }
.cla-scholarship-checks label { display: flex; gap: 11px; align-items: flex-start; cursor: pointer; }
.cla-scholarship-checks input { min-height: auto !important; margin-top: 4px; accent-color: rgb(var(--tc-tx-2262bc)); }
.cla-scholarship-check-progress { color: rgb(var(--tc-tx-2c5e9e)) !important; font-size: 12px; font-weight: 850; }
.cla-scholarship-empty { padding: 18px; border: 1px dashed rgb(var(--tc-bd-acc6df)); border-radius: 14px; color: rgb(var(--tc-tx-4a607a)); font-size: 13px; }
.cla-task-hub :focus-visible, .cla-scholarship-explorer :focus-visible { outline: 3px solid #5697dd; outline-offset: 3px; }
@media(max-width: 950px) { .cla-task-results { grid-template-columns: 1fr; } }
@media(max-width: 690px) {
  .cla-task-result { align-items: flex-start; flex-direction: column; }
  .cla-task-result > a { width: 100%; }
  .cla-scholarship-heading { flex-direction: column; align-items: stretch; }
  .cla-scholarship-summary { justify-items: start; }
  .cla-scholarship-controls { grid-template-columns: 1fr; }
  .cla-scholarship-track { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .cla-scholarship-track > div { padding: 10px; }
  .cla-scholarship-item-top { flex-direction: column; }
  .cla-scholarship-state { align-self: start; }
}
@media (prefers-reduced-motion: reduce) { .cla-task-filters button, .cla-task-result > a { transition: none; } }

/* Atlas — scientific provenance / source-coverage fingerprint, not an admission prediction */
.cla-source-coverage { margin: 14px 0 22px; padding: 15px; border: 1px solid rgb(var(--tc-bd-d5e4f5)); border-radius: 15px; background: rgb(var(--tc-bg-f8fbff)); }
.cla-source-coverage-track { height: 13px; display: flex; overflow: hidden; border-radius: 999px; background: rgb(var(--tc-bg-e7eef8)); }

.cla-source-coverage-track .is-method, .cla-source-coverage-legend .is-method { background: #1c65bf; }

.cla-source-coverage-track .is-missing, .cla-source-coverage-legend .is-missing { background: rgb(var(--tc-bg-becde0)); }
.cla-source-coverage-legend { display: flex; gap: 10px 20px; flex-wrap: wrap; margin-top: 13px; }
.cla-source-coverage-legend span { display: inline-flex; align-items: center; gap: 7px; color: rgb(var(--tc-tx-244661)); font-size: 12px; font-weight: 750; }
.cla-source-coverage-legend i { display: block; width: 11px; height: 11px; border-radius: 3px; }
.cla-source-coverage > p { margin: 12px 0 0; color: rgb(var(--tc-tx-4a647e)); font-size: 12px; }
.cla-source-registry-search { display: grid; grid-template-columns: minmax(0,1fr) minmax(150px,240px); gap: 12px; margin-bottom: 15px; }
.cla-source-registry-search label { display: grid; gap: 6px; color: rgb(var(--tc-tx-264766)); font-weight: 850; font-size: 12px; }
.cla-source-registry-search input, .cla-source-registry-search select { min-height: 43px; padding: 9px 12px; border: 1px solid rgb(var(--tc-bd-b6d1ed)); border-radius: 10px; background: rgb(var(--tc-bg-ffffff)); color: rgb(var(--tc-tx-193a60)); font-size: 14px; }
@media(max-width: 690px) { .cla-source-registry-search { grid-template-columns: 1fr; } }

/* CP37 — practical operating guide for students and Admin demo. */
.cla-ops-guide-page {
  min-height: 100vh;
  color: var(--cla-ink, rgb(var(--tc-tx-102b4a)));
  background: var(--cla-page, rgb(var(--tc-bg-f4f8fd)));
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.cla-ops-guide-header {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(100% - 36px, 1320px);
  margin: 0 auto;
  padding: 18px 0;
  border-bottom: 1px solid rgb(var(--tc-bd-dce7f4));
}
.cla-ops-guide-header > a { display: flex; align-items: center; }
.cla-ops-guide-header img { width: 42px; height: 42px; object-fit: contain; }
.cla-ops-guide-header > div { display: grid; gap: 2px; }
.cla-ops-guide-header > div span, .cla-ops-kicker, .cla-ops-section-heading > span,
.cla-ops-warning-grid article > span, .cla-ops-next-actions > div > span {

/* CP42 UI refinement — compact, analytical, data-first. Loaded after legacy themes.
   Structural routes, chart encodings, status colors and behavior belong to existing components. */
:root {
  --cla-page: #f5f6f8;
  --cla-surface: #fff;
  --cla-surface-soft: #f4f6f8;
  --cla-border: #dce2e9;
  --cla-ink: #182638;
  --cla-ink-soft: #354457;
  --cla-muted: #52647a;
  --cla-blue: #245ba7;
  --cla-hero: #193451;
  --cla-card-shadow: none;
  --ink: var(--cla-ink);
  --line: var(--cla-border);
  --paper: var(--cla-page);
  --shadow: none;
  --cla-panel-radius: 8px;
}
body { background: var(--cla-page); color: var(--cla-ink); }
:is(.student-page,.profile-page,.atlas-page,.lumen-page,.orion-page,.pulse-page,.haven-page,.cla-study-abroad-page,.nexus-page) {
  background: var(--cla-page) !important;
  color: var(--cla-ink);
}
:is(.atlas-floating-header,.lumen-floating-header,.orion-floating-header,.pulse-floating-header,.haven-floating-header) {
  width: 100%; height: 64px; padding: 0 max(20px, calc((100% - 1360px)/2));
  margin: 0; background: rgb(var(--tc-bg-ffffff)); border-bottom: 1px solid var(--cla-border);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
:is(.orion-home-logo,.pulse-home-logo,.haven-home-logo) { background: transparent; border: 0; box-shadow: none; backdrop-filter: none; border-radius: 0; }
:is(.atlas-shell,.lumen-shell,.orion-shell,.pulse-shell,.haven-shell,.cla-study-shell) {
  width: min(1360px, calc(100% - 48px)); padding-top: 24px;
}
.student-page .student-shell.student-dash,.profile-shell { background: transparent; border: 0; box-shadow: none; border-radius: 0; }
.student-page .student-shell.student-dash { width: min(100%, 1360px); padding: 0; }
/* Route-owned navigation is a plain tab band, not a card or a row of pills. */
.cla-module-subnav.cla-focus-nav { margin: 0 0 24px; padding: 0 0 12px; border: 0; border-bottom: 1px solid var(--cla-border); border-radius: 0; box-shadow: none; background: transparent; }
.cla-focus-nav .cla-module-subnav-head { padding: 0 0 8px; color: var(--cla-muted); }
.cla-focus-nav .cla-module-subnav-head > span { font-size: 11px; font-weight: 600; letter-spacing: .035em; color: var(--cla-muted); }
.cla-focus-nav .cla-module-subnav-links { gap: 2px 24px; border-bottom: 1px solid var(--cla-border); }
.cla-focus-nav .cla-module-subnav-links a { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; box-shadow: none; color: var(--cla-muted); font-size: 13px; font-weight: 500; padding: 10px 1px; min-height: 44px; }
.cla-focus-nav .cla-module-subnav-links a:is(:hover,:focus-visible) { color: var(--cla-blue); background: transparent; transform: none; }
.cla-focus-nav .cla-module-subnav-links a.is-active { border-bottom-color: var(--cla-blue); background: transparent; color: var(--cla-blue); font-weight: 650; box-shadow: none; }
.cla-focus-nav .cla-focus-heading { margin-top: 18px; }
.cla-focus-heading h1 { font-size: clamp(24px,2.6vw,32px); font-weight: 650; line-height: 1.25; letter-spacing: -.025em; }
.cla-focus-heading p { color: var(--cla-muted); font-size: 14px; }
/* Seed overview: one compact header, data as an adjacent summary, no marketing hero. */
.student-dash-hero,.student-intelligence-hero,.nexus-hero { background: var(--cla-hero) !important; box-shadow: none !important; border-radius: var(--cla-panel-radius); min-height: 0; padding: 24px 28px; }
.student-dash-hero::after,.nexus-hero::before,.lumen-overview-card::before,.lumen-overview-card::after { content: none; }
.student-dash-hero h1,.nexus-hero h1 { font-size: clamp(25px,3vw,36px); font-weight: 650; letter-spacing: -.025em; line-height: 1.18; margin: 8px 0 10px; }
.student-dash-hero-copy > p,.nexus-hero p { font-size: 14px; line-height: 1.6; font-weight: 400; margin: 0 0 16px; }
.student-dash-hero-summary { background: #243f5d; border: 1px solid #47617d; border-radius: 6px; padding: 18px; backdrop-filter: none; }
.student-dash-hero-summary-top > span,.student-dash-hero-metrics span { font-size: 11px; font-weight: 500; letter-spacing: .02em; }
.student-dash-primary-button,.student-dash-secondary-link { border-radius: 5px; font-weight: 600; min-height: 40px; padding: 9px 12px; gap: 8px; }
.student-dash-secondary-link { background: transparent; }
.student-dash .student-dash-module-grid { border-radius: 8px; border-color: var(--cla-border); }
.student-dash .student-dash-module-grid .student-dash-module { border-color: var(--cla-border); }
/* White workspace introduction, without a large banner or artificial glass effect. */
:is(.atlas-hero,.orion-hero,.pulse-hero,.haven-hero,.lumen-overview-card) { box-shadow: none; border-radius: 8px; }

:is(.atlas-hero-copy,.orion-hero,.pulse-hero,.haven-hero,.lumen-overview-copy) p { font-size: 14px; line-height: 1.6; font-weight: 400; }
:is(.orion-hero,.pulse-hero,.haven-hero) aside,.lumen-score-orb { border-radius: 6px; background: var(--cla-surface-soft); border-color: var(--cla-border); box-shadow: none; }

:is(.student-dash-card,.student-panel,.student-profile-card,.student-score-card,.student-panel-card,.student-journey-section,.student-skills-section,.profile-form-section,.nexus-action-card,.nexus-preview-panel,.nexus-role-switcher,.atlas-stat-card,.atlas-program-card,.atlas-source-card,.atlas-review-panel,.atlas-review-card,.atlas-gemini-panel,.atlas-engine-panel,.atlas-aspiration-card,.orion-control-panel,.orion-summary-card,.orion-focus-card,.orion-scenario-card,.orion-timeline-card,.pulse-control-panel,.pulse-metric-card,.pulse-summary-grid article,.pulse-action-card,.haven-control-panel,.haven-support-card,.haven-scholarship-card,.haven-summary-grid article,.lumen-panel,.lumen-dimension-card,.lumen-insight-card,.lumen-decision-card,.lumen-evidence-card,.lumen-ai-explanation-card,.lumen-gemini-panel,.cla-study-panel,.cla-source-explorer,.cla-source-card,.cla-study-school,.cla-major-card,.cla-signal-atlas,.orion-tradeoff-panel,.atlas-cutoff-field,.cla-visual-card) {

:is(.student-dash-card,.nexus-role-switcher,.atlas-stat-card,.atlas-program-card,.atlas-source-card,.orion-control-panel,.orion-summary-card,.orion-focus-card,.orion-scenario-card,.orion-timeline-card,.pulse-control-panel,.pulse-metric-card,.pulse-summary-grid article,.pulse-action-card,.haven-control-panel,.haven-summary-grid article,.lumen-panel,.lumen-evidence-card,.cla-signal-atlas,.orion-tradeoff-panel,.atlas-cutoff-field,.cla-visual-card) { background: rgb(var(--tc-bg-ffffff)); border-color: var(--cla-border); }

:is(.lumen-dimension-card,.lumen-insight-card,.lumen-decision-card,.atlas-program-card,.atlas-source-card,.nexus-action-card):hover { transform: none; box-shadow: none !important; }
:is(.student-dash-heading,.atlas-section-head,.orion-section-head,.pulse-section-head,.haven-section-head,.lumen-panel-heading,.cla-signal-atlas-heading,.orion-tradeoff-heading,.atlas-cutoff-field-heading) h2 { font-size: clamp(18px,2vw,23px); line-height: 1.3; letter-spacing: -.015em; font-weight: 650; }

@media(max-width: 760px) {

/* ==========================================================================
   Cognitive Observatory – bản sắc giao diện CLA, hai chế độ sáng/tối.
   Nạp SAU 36-cla-dark.generated.css. Mọi màu ở đây đi qua token, nên tự đổi theo theme.
   Muốn đổi màu thương hiệu: sửa khối :root và :root[data-theme="dark"] bên dưới.
   ========================================================================== */

/* ---------- 1. Token ---------- */
:root {
  --t-bg: #f2f5fb;
  --t-bg-2: #e8eef9;
  --t-surface: #ffffff;
  --t-surface-2: #f6f8fd;
  --t-line: #dbe3f1;
  --t-line-strong: #b9c6e0;
  --t-ink: #0a1430;
  --t-ink-2: #34425f;
  --t-muted: #5b6987;
  --t-accent: #2f5bff;
  --t-accent-2: #0a93bd;
  --t-ring: rgba(47, 91, 255, 0.22);
  --t-grid: rgba(40, 70, 140, 0.055);
  --t-glow-a: rgba(47, 91, 255, 0.16);
  --t-glow-b: rgba(10, 147, 189, 0.12);
  --t-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 14px 40px -16px rgba(26, 48, 110, 0.22);
  --t-radius: 16px;

  /* Màu ánh sáng của từng module (tối hơn ở nền sáng để đủ tương phản) */
  --m-seed: #3f9b1d;
  --m-lumen: #b77a00;
  --m-atlas: #0a8fb5;
  --m-orion: #6d4df0;
  --m-pulse: #079b6b;
  --m-haven: #d4581f;
  --m-nexus: #2f5bff;

  /* Biến cũ của dự án trỏ về token mới */
  --ink: var(--t-ink);
  --blue: var(--t-accent);
  --blue-2: var(--t-accent-2);
  --line: var(--t-line);
  --muted: var(--t-muted);
  --sheet: var(--t-surface);
  --paper: var(--t-bg);
  --shadow: var(--t-shadow);
  --cla-ink: var(--t-ink);
  --cla-ink-soft: var(--t-ink-2);
  --cla-muted: var(--t-muted);
  --cla-blue: var(--t-accent);
  --cla-cyan: var(--t-accent-2);
  --cla-border: var(--t-line);
  --cla-surface: var(--t-surface);
  --cla-surface-soft: var(--t-surface-2);
  --cla-page: var(--t-bg);
  --cla-card-shadow: var(--t-shadow);
}

:root[data-theme="dark"] {
  --t-bg: #060b1a;
  --t-bg-2: #0a1226;
  --t-surface: #0d1730;
  --t-surface-2: #101c3a;
  --t-line: #1c2a4b;
  --t-line-strong: #2b3f6b;
  --t-ink: #e9efff;
  --t-ink-2: #bac7e6;
  --t-muted: #8d9fc6;
  --t-accent: #4f7bff;
  --t-accent-2: #4cd7f6;
  --t-ring: rgba(108, 147, 255, 0.35);
  --t-grid: rgba(143, 178, 255, 0.055);
  --t-glow-a: rgba(63, 104, 255, 0.22);
  --t-glow-b: rgba(76, 215, 246, 0.1);
  --t-shadow: 0 1px 0 rgba(160, 190, 255, 0.07) inset, 0 18px 50px -20px rgba(0, 0, 0, 0.7);

  --m-seed: #9be564;
  --m-lumen: #ffc857;
  --m-atlas: #4cd7f6;
  --m-orion: #a58bff;
  --m-pulse: #3df2b0;
  --m-haven: #ff9f6b;
  --m-nexus: #6c93ff;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

/* ---------- 2. Nền, chữ, tương tác chung ---------- */
html {
  font-family: "Be Vietnam Pro", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  scroll-behavior: smooth;
}
body {
  color: var(--t-ink);
  background-color: var(--t-bg);
  background-image:
    radial-gradient(900px 520px at 88% -6%, var(--t-glow-a), transparent 70%),
    radial-gradient(720px 480px at 2% 6%, var(--t-glow-b), transparent 70%),
    linear-gradient(var(--t-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--t-grid) 1px, transparent 1px);
  background-size: auto, auto, 44px 44px, 44px 44px;
  background-attachment: fixed;
  transition: background-color 0.3s ease, color 0.3s ease;
}
h1, h2, h3 { letter-spacing: -0.02em; }
::selection { background: color-mix(in srgb, var(--t-accent) 35%, transparent); color: inherit; }
:focus-visible { outline: 2px solid var(--t-accent-2); outline-offset: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--t-line-strong) transparent; }
code, kbd, samp, .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }

/* ---------- 3. Bề mặt: panel và card dùng chung ---------- */
.role-shell,
.role-preview-card,
.role-task-section,
.role-card-grid article,
.student-panel,
.cla-study-panel,
.cla-journey__card,
.cla-major-card,
.lumen-decision-card,
.lumen-evidence-card,
.pulse-metric-card,
.profile-form-section,
.orion-tradeoff-panel {
  background: linear-gradient(180deg, var(--t-surface), var(--t-surface-2));
  border: 1px solid var(--t-line);
  box-shadow: var(--t-shadow);
  transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.3s ease;
}
.role-card-grid article:hover,
.student-panel:hover,
.cla-major-card:hover,
.pulse-metric-card:hover {
  border-color: color-mix(in srgb, var(--t-accent) 50%, var(--t-line));
}
.role-shell { border-radius: 28px; }
.role-card-grid article, .role-preview-card, .role-task-section { border-radius: var(--t-radius); }

/* ---------- 4. Form ---------- */
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]),
select,
textarea {
  background: var(--t-surface-2);
  color: var(--t-ink);
  border: 1px solid var(--t-line-strong);
  border-radius: 10px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
input::placeholder, textarea::placeholder { color: var(--t-muted); opacity: 0.8; }
input:focus-visible, select:focus-visible, textarea:focus-visible {
  border-color: var(--t-accent);
  box-shadow: 0 0 0 3px var(--t-ring);
  outline: none;
}
.role-landing-copy button,
.admin-actions button {
  background: linear-gradient(135deg, var(--t-accent), color-mix(in srgb, var(--t-accent-2) 70%, var(--t-accent)));
  color: #fff;
  border: 0;
  border-radius: 12px;
  box-shadow: 0 10px 28px -10px var(--t-accent);
}
.role-landing-copy button:hover, .admin-actions button:hover { filter: brightness(1.08); }

/* ---------- 5. Vòng quỹ đạo module ---------- */
.cla-orbit {
  --hue: var(--m-seed);
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(12px, 3vw, 44px);
  align-items: center;
  margin: 28px 0;
  padding: clamp(18px, 3vw, 34px);
  border: 1px solid var(--t-line);
  border-radius: 24px;
  background:
    radial-gradient(520px 360px at 82% 40%, color-mix(in srgb, var(--hue) 12%, transparent), transparent 70%),
    linear-gradient(180deg, var(--t-surface), var(--t-surface-2));
  box-shadow: var(--t-shadow);
  transition: background 0.4s ease;
}
.cla-orbit__copy h2 { margin: 0 0 8px; font-size: clamp(22px, 2.6vw, 32px); line-height: 1.2; max-width: 20ch; }
.cla-orbit__copy > p { margin: 0 0 20px; color: var(--t-muted); max-width: 44ch; }
.cla-orbit__info {
  padding: 18px 20px;
  min-height: 176px;
  border: 1px solid var(--t-line);
  border-left: 3px solid var(--hue);
  border-radius: 6px 14px 14px 6px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--hue) 10%, transparent), transparent 75%);
  transition: border-color 0.3s ease;
}
.cla-orbit__info h3 { margin: 0; font-size: 20px; color: var(--hue); transition: color 0.3s ease; }
.cla-orbit__info strong { display: block; margin: 2px 0 8px; font-weight: 500; color: var(--t-ink-2); font-size: 14.5px; }
.cla-orbit__info p { margin: 0 0 14px; color: var(--t-muted); font-size: 14px; }
.cla-orbit__open {
  display: inline-block; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 14px;
  text-decoration: none; color: var(--t-bg); background: var(--t-ink);
}
.cla-orbit__open:hover { background: var(--hue); }
.cla-orbit__note { font-size: 13px; color: var(--t-muted); }
.cla-orbit__svg { width: 100%; height: auto; max-height: 72vh; display: block; }
.cla-orbit__outer { fill: none; stroke: var(--t-line); stroke-width: 1; stroke-dasharray: 1 7; }
.cla-orbit__svg .seg { fill: none; stroke: var(--t-line-strong); stroke-width: 1.2; transition: stroke 0.3s, stroke-width 0.3s; }
.cla-orbit__svg .seg.on { stroke: var(--hue); stroke-width: 2.4; }
.cla-orbit__svg .spoke { stroke: var(--t-line); stroke-width: 1; stroke-dasharray: 2 5; }
.cla-orbit__svg .spoke.on { stroke: var(--hue); stroke-dasharray: none; opacity: 0.9; }
.cla-orbit__svg .packet { fill: var(--t-ink); filter: drop-shadow(0 0 6px var(--t-accent)); }
.cla-orbit__svg .core-ring { fill: none; stroke: var(--t-accent); stroke-opacity: 0.35; stroke-width: 1.3; }
.cla-orbit__svg .core-ring.is-inner { stroke-opacity: 0.9; }
.cla-orbit__node { cursor: pointer; outline: none; }
.cla-orbit__node .disc { fill: var(--t-surface); stroke: var(--c); stroke-width: 1.5; transition: stroke-width 0.25s, filter 0.25s; }
.cla-orbit__node .halo { fill: var(--c); opacity: 0; transition: opacity 0.3s; }
.cla-orbit__node:hover .halo, .cla-orbit__node:focus-visible .halo, .cla-orbit__node.is-on .halo { opacity: 0.18; }
.cla-orbit__node.is-on .disc { stroke-width: 2.5; filter: drop-shadow(0 0 9px var(--c)); }
.cla-orbit__node .glyph { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.cla-orbit__node text { fill: var(--t-muted); font-size: 14px; text-anchor: middle; transition: fill 0.25s; }
.cla-orbit__node.is-on text { fill: var(--t-ink); }
.cla-orbit__node:focus-visible .disc { stroke-width: 3; }
@media (max-width: 900px) {
  .cla-orbit { grid-template-columns: 1fr; }
  .cla-orbit__svg { order: -1; max-width: 520px; margin: 0 auto; }
}
@media (max-width: 600px) {
  .cla-orbit__node text { font-size: 21px; }
}

/* ---------- 6. Nút chuyển sáng / tối ---------- */
.cla-theme-toggle {
  position: fixed;
  z-index: 1090;
  left: max(14px, env(safe-area-inset-left));
  bottom: max(16px, env(safe-area-inset-bottom));
  display: flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--t-line-strong);
  border-radius: 999px;
  background: color-mix(in srgb, var(--t-surface) 82%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--t-shadow);
}
.cla-theme-toggle button {
  display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
  border: 0; border-radius: 50%; background: transparent; color: var(--t-muted); cursor: pointer;
  box-shadow: none; transform: none;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.cla-theme-toggle button:hover { color: var(--t-ink); transform: none; }
.cla-theme-toggle button[aria-pressed="true"] { background: var(--t-accent); color: #fff; }
.cla-theme-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cla-theme-toggle svg .fill { fill: currentColor; }

/* ---------- 7. Chuyển theme mượt, tôn trọng reduced-motion ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  body, .cla-orbit, .cla-orbit * { transition: none !important; }
}

/* CP44 · CLA DAYLIGHT CONTRAST CONTRACT
 * The one authoritative student analytical-canvas skin. Legacy CP42 Observatory
 * styles are retired; the structural CSS below is independent of their colors.
 * Tokens describe text on a named surface, not arbitrary palette picks.
 * Light mode is deliberate until another mode can pass the same contrast contract.
 */

/* Semantic color pairs: all standard text roles pass WCAG AA on every paired
 * surface: canvas (#ffffff), subtle (#f0f5fc), page (#f6f8fc).
 * Contrast ratios are asserted by tests/cp44-contrast-contract.test.cjs.
 */
:root {
  --cla-bg-canvas: #ffffff;
  --cla-bg-page: #f6f8fc;
  --cla-bg-subtle: #f0f5fc;
  --cla-text-primary: #142941;
  --cla-text-secondary: #405a72;
  --cla-text-muted: #526a81;
  --cla-text-link: #2d5ba8;
  --cla-text-accent-teal: #17685f;
  --cla-text-accent-violet: #5264c9;
  --cla-text-accent-amber: #8f561e;
  --cla-border-subtle: #dde5f0;
  --cla-focus-ring: #2d5ba8;
}
/* Preserve the information architecture after removing the two conflicting
 * CP42 skins. Geometry belongs here; colors are owned by the semantic tokens. */
.student-dash .cla-observatory-intro {
  display: grid; grid-template-columns: minmax(0,1fr) minmax(205px,28%);
  align-items: center;
}
/* Original target used a grid. Without this, metadata collapses into a single line. */
.student-dash .cla-intro-target { display: grid; grid-template-columns: minmax(0,1fr); gap: 6px; min-width: 0; }
.student-dash .cla-intro-target :is(span,strong,small,a) { display: block; overflow-wrap: anywhere; }
.student-dash .cla-intro-target > span { color: var(--cla-text-muted); font-size: 11px; letter-spacing: .04em; font-weight: 650; }
.student-dash .cla-intro-target > small { color: var(--cla-text-muted); line-height: 1.5; }
.cla-decision-canvas { isolation: isolate; }
.student-dash .cla-canvas-head {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px;
}
.cla-canvas-grid { display: grid; min-width: 0; grid-template-areas: 'cognitive academic' 'temporal temporal'; }
.cla-canvas-grid > article { min-width: 0; box-shadow: none; border-radius: 0; }
.cla-canvas-cognitive { grid-area: cognitive; }
.cla-canvas-academic { grid-area: academic; }
.cla-canvas-temporal { grid-area: temporal; grid-column: 1/-1; }
.cla-canvas-label { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.cla-canvas-index,.cla-canvas-source,.cla-canvas-label > span,.cla-canvas-flow > span { font-size: 11px; font-weight: 650; }
.cla-canvas-kpi { line-height: 1.1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.cla-canvas-kpi small { margin-left: 8px; font-weight: 500; letter-spacing: 0; }
.cla-canvas-gpa { width: 100%; display: block; max-height: 235px; }
.cla-canvas-gpa text { font-family: inherit; font-size: 11px; }
.cla-canvas-gpa .cla-canvas-chart-value { font-size: 13px; font-weight: 700; }
.cla-spectral-layout { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(158px,.85fr); gap: 22px; align-items: center; }
.cla-spectral-dial { display: block; width: 100%; height: auto; overflow: visible; }
.cla-dial-boundary { fill: none; stroke-width: 1; }
.cla-dial-arc { transition: stroke-dasharray .35s ease-out; }
.cla-spectrum-key { min-width: 0; display: grid; }
.cla-spectrum-item { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 10px; align-items: center; }
.cla-spectrum-item i { display: block; height: 32px; width: 3px; border-radius: 4px; }
.cla-spectrum-item > div { display: grid; gap: 4px; min-width: 0; }
.cla-spectrum-item strong { font-variant-numeric: tabular-nums; }
.cla-canvas-temporal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 18px; flex-wrap: wrap; }
.cla-canvas-switch { display: flex; align-items: center; flex-wrap: wrap; }
.cla-canvas-switch button { cursor: pointer; }
.cla-canvas-empty { position: relative; min-height: 145px; display: grid; place-items: center; margin: 10px 0; }
.cla-canvas-empty svg { position: absolute; inset: 0; height: 100%; width: 100%; }
.cla-canvas-empty > div { position: relative; display: grid; gap: 7px; padding: 16px; text-align: center; }
.cla-canvas-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px; }
.cla-canvas-flow a { text-decoration: none; }
.cla-canvas-flow a:hover { text-decoration: underline; text-underline-offset: 4px; }
.cla-canvas-flow a:not(:last-child)::after { content: ' →'; margin-left: 9px; }
.cla-canvas-temporal .cla-viz-plot { max-height: 285px; width: 100%; }
@media (max-width: 1100px) {
  .cla-spectral-layout { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 760px) {
  .cla-canvas-grid { grid-template-areas: 'cognitive' 'academic' 'temporal'; }
  .cla-canvas-head { align-items: flex-start; }
  .cla-canvas-gpa,.cla-canvas-temporal .cla-viz-plot { max-height: none; }
  .cla-canvas-switch { flex-wrap: nowrap; overflow-x: auto; }
}

:root {
  --cla-page: var(--cla-bg-page);
  --cla-surface: var(--cla-bg-canvas);
  --cla-surface-soft: var(--cla-bg-subtle);
  --cla-border: #dde5f0;
  --cla-ink: var(--cla-text-primary);
  --cla-ink-soft: var(--cla-text-secondary);
  --cla-muted: var(--cla-text-muted);
  --cla-blue: var(--cla-text-link);
  --cla-cyan: var(--cla-text-accent-teal);
  --cla-hero: linear-gradient(130deg, #eaf2ff 0%, #f9fbff 60%, #edf8f7 100%);
  --cla-card-shadow: 0 12px 38px -27px rgba(27, 57, 111, .25);
  --cla-panel-radius: 19px;
  --t-bg: #f6f8fc;
  --t-bg-2: #edf3fb;
  --t-surface-2: #f8faff;
  --t-line: #dde5f0;
  --t-line-strong: #bacade;
  --t-ink: var(--cla-text-primary);
  --t-ink-2: var(--cla-text-secondary);
  --t-muted: var(--cla-text-muted);
  --t-accent: var(--cla-text-link);
  --t-accent-2: var(--cla-text-accent-teal);
  --t-shadow: 0 12px 38px -27px rgba(27, 57, 111, .25);
  --t-radius: 19px;
}
body {
  background-color: #f6f8fc;
  background-image: radial-gradient(ellipse 60% 44% at 88% 0%, rgba(75, 116, 229, .09), transparent 72%),
                    radial-gradient(ellipse 44% 39% at -7% 18%, rgba(35, 174, 167, .065), transparent 74%) !important;
  background-size: auto !important;
  background-attachment: scroll !important;
  color: var(--cla-ink);
  font-family: 'Be Vietnam Pro', Inter, ui-sans-serif, system-ui, sans-serif;
}
:is(.student-page,.profile-page,.atlas-page,.lumen-page,.orion-page,.pulse-page,.haven-page,.cla-study-abroad-page,.nexus-page) {
  background: transparent !important;
  color: var(--cla-ink);
}
:is(.student-floating-header,.atlas-floating-header,.lumen-floating-header,.orion-floating-header,.pulse-floating-header,.haven-floating-header) {
  background: rgba(255,255,255,.93) !important;
  border-bottom: 1px solid #e1e8f3 !important;
  box-shadow: 0 7px 20px -18px rgba(18,42,83,.28) !important;
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
:is(.student-shell.student-dash,.atlas-shell,.lumen-shell,.orion-shell,.pulse-shell,.haven-shell,.cla-study-shell) {
  max-width: 1420px;
}
/* A confident journal-like title above scientific figures — no giant dark hero. */
.student-page:has(.cla-decision-canvas) { background: transparent !important; }
.student-page .student-shell.student-dash:has(.cla-decision-canvas) {
  width: min(1420px, calc(100% - 52px));
  padding-bottom: 64px;
}
.student-dash .cla-observatory-intro {
  background: transparent !important;
  color: var(--cla-ink);
  margin: 0 0 8px;
  padding: 24px 3px 25px;
  gap: clamp(22px, 6vw, 70px);
}
.student-dash .cla-observatory-intro h1 {
  color: #142941;
  font-size: clamp(31px,3.6vw,52px);
  font-weight: 680;
  letter-spacing: -.055em;
  line-height: 1.12;
  margin: 11px 0;
}
.student-dash .cla-observatory-intro p { color: var(--cla-text-muted); font-size: clamp(13px,1.16vw,16px); line-height: 1.65; }
.student-dash .cla-observatory-intro .cla-canvas-index {
  color: var(--cla-text-secondary); letter-spacing: .055em; font-family: inherit; font-weight: 760; font-size: 11px;
}
.student-dash .cla-intro-target {
  border: 1px solid #dbe5f1;
  border-left: 3px solid #24a19a;
  background: linear-gradient(120deg,#fff 0%,#f4f9ff 100%);
  padding: 16px 19px;
  border-radius: 0 16px 16px 0;
  box-shadow: 0 10px 28px -22px rgba(29,66,118,.35);
  gap: 6px;
}
.student-dash .cla-intro-target strong { color: #1d3450; font-size: 18px; }
.student-dash .cla-intro-target small { color: var(--cla-text-muted); }
.student-dash .cla-intro-target a { color: #305db2; font-size: 12px; }

/* The 3-panel learning observatory now feels like a daylight instrument.
 * Visual channels remain: three independent index arcs, GPA by school year,
 * and an observed-vs-EMA series with explicit missing data. */
.student-dash .cla-decision-canvas {
  --instrument-ink: #142941;
  --instrument-muted: #647a94;
  --instrument-line: #dfe7f1;
  --instrument-cyan: #138f86;
  position: relative;
  background: #fff !important;
  color: #142941 !important;
  border: 1px solid #d9e4f0 !important;
  border-radius: 24px;
  box-shadow: 0 20px 50px -36px rgba(32,63,109,.40);
  overflow: hidden;
  margin-bottom: 28px;
}
.student-dash .cla-decision-canvas::before {
  content: '';
  z-index: 0;
  position: absolute; inset: 0;
  background: radial-gradient(circle at 85% 18%,rgba(63,112,217,.045) 1px,transparent 1.5px);
  background-size: 17px 17px;
  opacity: .6;
  mask-image: linear-gradient(to left, #000, transparent 64%);
  pointer-events: none;
}
.student-dash .cla-decision-canvas::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg,#2b9e9b,#5c7bd6 48%,#a8b4ec);
}
.student-dash .cla-canvas-head {
  background: linear-gradient(104deg,#fff 0%,#f8fbff 75%,#f1f7fc 100%);
  padding: 24px 29px 21px;
  border-bottom: 1px solid #dfe7f1;
}
.student-dash .cla-canvas-head h2 {
  color: #142941 !important;
  font-size: clamp(22px,2.4vw,31px); font-weight: 700;
}
.student-dash .cla-decision-canvas :is(.cla-canvas-index,.cla-canvas-label > span,.cla-canvas-flow > span) {
  color: var(--cla-text-muted) !important; font-family: inherit; font-size: 10px; font-weight: 720; letter-spacing: .08em;
}
.student-dash .cla-canvas-source {
  color: var(--cla-text-muted); background: white; border: 1px solid #dbe5f1;
  font-family: inherit; font-size: 10px; font-weight: 650; line-height: 1.35; padding: 9px 12px; border-radius: 999px;
}
.student-dash .cla-canvas-grid { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); }
.student-dash .cla-canvas-grid > article { padding: 24px 29px 19px; }
.student-dash .cla-canvas-cognitive { border-right: 1px solid #e1e8f2; background: #fff; }
.student-dash .cla-canvas-academic { background: linear-gradient(149deg,#f7faff,#fff 69%); }
.student-dash .cla-canvas-temporal { border-top: 1px solid #e1e8f2; background: #fbfcff; }
.student-dash .cla-canvas-grid h3 { color: #142941; font-size: 20px; font-weight: 670; margin: 12px 0 14px; }
.student-dash .cla-canvas-kpi { color: #1c405d; font-size: clamp(41px,3.9vw,55px); font-weight: 675; }
.student-dash .cla-canvas-kpi small { color: var(--cla-text-muted); font-size: 12px; }
.student-dash .cla-canvas-note { color: var(--cla-text-muted); font-size: 11px; line-height: 1.7; }
.student-dash .cla-decision-canvas a { color: #315fb4; font-weight: 675; }
.student-dash .cla-decision-canvas a:hover { color: #159188; }
.student-dash .cla-spectral-layout { min-height: 267px; gap: 22px; }
.student-dash .cla-spectral-dial { max-height: 285px; filter: none; }
.student-dash .cla-dial-boundary { stroke: #c6d5e4; stroke-opacity: .60; }
.student-dash .cla-dial-number { fill: #183755; font-weight: 650; font-size: 39px; }
.student-dash .cla-dial-caption { fill: var(--cla-text-muted); font-size: 9px; font-family: inherit; letter-spacing: .9px; }
.student-dash .cla-spectrum-key { gap: 0; }
.student-dash .cla-spectrum-item { border-bottom-color: #e3eaf3; padding: 15px 0; }
.student-dash .cla-spectrum-item b { color: #344e69; font-size: 13px; }
.student-dash .cla-spectrum-item span { color: var(--cla-text-muted); font-size: 11px; }
.student-dash .cla-spectrum-item strong { font-weight: 680; font-size: 24px; }
.student-dash .cla-canvas-gpa text { fill: var(--cla-text-muted); }
.student-dash .cla-canvas-gpa .cla-canvas-chart-value { fill: #3557ae; font-weight: 730; }
.student-dash .cla-canvas-switch { background: #edf3fb; border: 1px solid #dce6f0; border-radius: 12px; padding: 4px; gap: 2px; }
.student-dash .cla-canvas-switch button { border: 0; border-radius: 8px; padding: 9px 13px; color: var(--cla-text-muted); font-weight: 600; min-height: 37px; }
.student-dash .cla-canvas-switch button[aria-pressed='true'] { background: #fff; color: #2f55ae; box-shadow: 0 3px 12px rgba(44,82,135,.10); }
.student-dash .cla-canvas-temporal .cla-viz-figure { color: var(--cla-text-muted); }
.student-dash .cla-canvas-temporal .cla-viz-caption strong { color: #27445f; font-weight: 670; }
.student-dash .cla-canvas-temporal .cla-viz-observed { stroke: #315fb4; }
.student-dash .cla-canvas-temporal .cla-viz-ema { stroke: #109a91; }
.student-dash .cla-canvas-temporal .cla-viz-dot { fill: #315fb4; stroke: white; }
.student-dash .cla-canvas-temporal .cla-viz-legend .is-blue:before { background: #315fb4; }
.student-dash .cla-canvas-temporal .cla-viz-legend .is-teal:before { background: #109a91; }
.student-dash .cla-canvas-empty { min-height: 156px; }
.student-dash .cla-canvas-empty > div { background: rgba(255,255,255,.96); border: 1px solid #e1e9f4; border-radius: 14px; box-shadow: 0 8px 22px -18px #4d6686; }
.student-dash .cla-canvas-empty strong { color: #284562; }
.student-dash .cla-canvas-empty span { color: var(--cla-text-muted); }
.student-dash .cla-canvas-flow { background: #f1f6fc; border-top: 1px solid #dfe7f1; padding: 16px 29px; }
.student-dash .cla-canvas-flow a:not(:last-child)::after { color: #b4c2d6; }
/* Downstream is an editorial activity feed, not a matrix of colorful tiles. */
.student-dash:has(.cla-decision-canvas) .student-dash-card {
  background: #fff; border: 1px solid #dfe7f2; border-radius: 19px;
  box-shadow: 0 13px 32px -29px #25476c !important;
}
.student-dash .student-dash-focus { gap: 17px; margin-top: 20px; }
.student-dash .student-dash-action { padding: 14px 4px; border-bottom: 1px solid #e5ecf4; }
.student-dash .student-dash-action:hover { background: #f4f8fe; border-radius: 9px; }
.student-dash .student-dash-module-grid {
  display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
  border: 1px solid #dfe8f1; border-radius: 20px !important; gap: 0;
  background: white !important; overflow: hidden;
  box-shadow: 0 14px 38px -32px #274a7e !important;
}
.student-dash .student-dash-module-grid .student-dash-module {
  min-height: 105px; padding: 17px 22px; margin: 0;
  display: flex; align-items: center; gap: 17px;
  border: 0; border-bottom: 1px solid #e5ebf4; border-radius: 0;
  background: #fff; box-shadow: none !important;
  transition: background .18s ease;
}
.student-dash .student-dash-module-grid .student-dash-module:nth-child(odd) { border-right: 1px solid #e5ebf4; }
.student-dash .student-dash-module-grid .student-dash-module:hover { background: #f4f8fe; transform: none; }
.student-dash .student-dash-module-icon {
  width: 58px; height: 58px; flex: 0 0 58px;
  border-radius: 16px; background: #edf3fc; border: 1px solid #e1e9f4; box-shadow: none;
}
.student-dash .student-dash-module-icon img { width: 44px; height: 44px; object-fit: contain; }
.student-dash .cla-focus-module-copy { gap: 4px; flex: 1; }
.student-dash .cla-focus-module-copy small { color: var(--cla-text-muted); font-weight: 650; letter-spacing: .015em; }
.student-dash .cla-focus-module-copy strong { color: #26435e; font-size: 15px; font-weight: 700; margin: 0; }
.student-dash .cla-focus-module-copy > span { color: var(--cla-text-muted); line-height: 1.5; }
.student-dash .cla-focus-module-arrow { color: #5477b3; font-size: 21px; flex: 0 0 auto; }
/* Every student-facing module shares the same compact, scrollable chapter index. */
.cla-module-subnav.cla-focus-nav {
  margin: 0 0 28px; padding: 0 0 11px;
  background: transparent; border: 0; border-bottom: 1px solid #dce5ef;
  box-shadow: none;
}
.cla-focus-nav .cla-module-subnav-head { padding: 2px 0 13px; }
.cla-focus-nav .cla-module-subnav-head > span { color: var(--cla-text-muted); font-family: inherit; font-size: 11px; font-weight: 730; line-height: 1.4; letter-spacing: .09em; }
.cla-focus-nav .cla-focus-home {
  color: #496aaa; border: 1px solid #dfe7f1; background: white; border-radius: 999px;
  padding: 8px 13px; font-size: 11px; font-weight: 680; text-decoration: none;
}
.cla-focus-nav .cla-module-subnav-links {
  display: flex; flex-wrap: nowrap; gap: 7px; padding: 2px 0 9px;
  overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin;
  border-bottom: 0; -webkit-overflow-scrolling: touch;
}
.cla-focus-nav .cla-module-subnav-links a {
  flex: 0 0 auto; min-height: 39px; padding: 9px 15px; white-space: nowrap;
  color: var(--cla-text-muted); border: 1px solid transparent; border-radius: 10px;
  background: transparent; font-size: 12px; font-weight: 650;
  transition: border-color .14s, color .14s, background-color .14s;
}
.cla-focus-nav .cla-module-subnav-links a:hover { color: #3457a8; background: #edf3fc; border-color: #e3eafa; }
.cla-focus-nav .cla-module-subnav-links a.is-active {
  color: #234b9c; background: white; border: 1px solid #d1def4;
  box-shadow: 0 4px 14px -12px #2c50a1; font-weight: 760;
}
.cla-focus-nav .cla-focus-heading { margin-top: 24px; }
.cla-focus-heading h1 { color: #173451; font-size: clamp(25px,2.8vw,36px); letter-spacing: -.04em; font-weight: 720; }
.cla-focus-heading p { max-width: 74ch; margin: 8px 0 4px; color: var(--cla-text-muted); }
/* Unified section language, consistent depth without repetitive dark blocks. */
:is(.atlas-hero,.orion-hero,.pulse-hero,.haven-hero) { background: transparent !important; box-shadow: none !important; }
:is(.atlas-hero-copy,.atlas-hero-card,.orion-hero,.pulse-hero,.haven-hero,.lumen-overview-card) {
  background: #fff !important; color: #193553 !important;
  border: 1px solid #dde6f1 !important; border-radius: 20px !important;
  box-shadow: 0 14px 34px -30px rgba(29,59,110,.33) !important;
}
:is(.atlas-hero-copy,.orion-hero,.pulse-hero,.haven-hero,.lumen-overview-copy) :is(h1,h2) { color: #173551 !important; }
:is(.atlas-hero-copy,.orion-hero,.pulse-hero,.haven-hero,.lumen-overview-copy) p { color: var(--cla-text-muted) !important; }
:is(.atlas-hero-copy,.orion-hero,.pulse-hero,.haven-hero) > div > span:first-child,
.atlas-hero-copy > span { color: #3861af !important; }
:is(.atlas-hero-card,.orion-hero,.pulse-hero,.haven-hero) :is(aside,.atlas-flow) { color: #274762; }
:is(.orion-hero,.pulse-hero,.haven-hero) aside { background: #f2f6fc !important; border: 1px solid #dfe8f2; border-radius: 15px; }
:is(.orion-hero,.pulse-hero,.haven-hero) aside :is(strong,span) { color: #244666; }
:is(.lumen-panel,.lumen-dimension-card,.lumen-insight-card,.lumen-decision-card,.lumen-evidence-card,
    .atlas-stat-card,.atlas-program-card,.atlas-source-card,.atlas-review-card,.atlas-engine-panel,
    .orion-control-panel,.orion-summary-card,.orion-focus-card,.orion-scenario-card,.orion-timeline-card,
    .pulse-control-panel,.pulse-metric-card,.pulse-summary-grid article,.pulse-action-card,
    .haven-control-panel,.haven-summary-grid article,.haven-support-card,.haven-scholarship-card,
    .cla-visual-card,.orion-tradeoff-panel,.atlas-cutoff-field,.cla-source-explorer,.cla-study-panel) {
  border-radius: 18px !important;
  border-color: #dfe7f1;
  box-shadow: 0 11px 30px -28px rgba(34,69,123,.33) !important;
}
.cla-workflow-tabs { border-bottom-color: #dce7f1; gap: 4px; }
.cla-workflow-tabs button { border-radius: 9px 9px 0 0; font-weight: 660; }
.cla-workflow-tabs button[aria-pressed='true'] { color: #3156ac; border-bottom-color: #3a65c9; background: #f0f5ff; }
.cla-focus-disclosure { border-radius: 13px; background: #fff; border: 1px solid #dde6f1; }
.cla-focus-notice { border-radius: 13px; }
:is(.atlas-page,.lumen-page,.orion-page,.pulse-page,.haven-page) :is(input,select,textarea) { border-radius: 10px; }
:is(.atlas-page,.lumen-page,.orion-page,.pulse-page,.haven-page) :is(button,a) { -webkit-tap-highlight-color: transparent; }
/* Keep user motion light and responsive: navigation is SPA now, no page-wide parallax. */
@media (max-width: 1100px) {
  .student-dash .cla-canvas-grid>article { padding: 20px; }
  .student-dash .cla-spectral-layout { grid-template-columns: minmax(0,1fr); }
  .student-dash .cla-spectral-dial { max-height: 245px; }
  .student-dash .cla-spectrum-item { padding: 10px 0; }
}
@media (max-width: 760px) {
  .student-page .student-shell.student-dash:has(.cla-decision-canvas) { width: calc(100% - 26px); }
  .student-dash .cla-observatory-intro { grid-template-columns: 1fr; padding: 18px 0 14px; gap: 14px; }
  .student-dash .cla-observatory-intro h1 { font-size: clamp(29px,8vw,40px); }
  .student-dash .cla-canvas-head { padding: 20px; gap: 11px; }
  .student-dash .cla-canvas-grid { grid-template-columns: minmax(0,1fr); grid-template-areas: 'cognitive' 'academic' 'temporal'; }
  .student-dash .cla-canvas-grid>article { padding: 21px 18px; }
  .student-dash .cla-canvas-cognitive { border-right: 0; border-bottom: 1px solid #e1e8f2; }
  .student-dash .cla-spectral-layout { grid-template-columns: minmax(0,1fr); }
  .student-dash .cla-spectral-dial { max-height: 260px; }
  .student-dash .cla-canvas-switch { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .student-dash .cla-canvas-switch button { flex: 1 0 auto; }
  .student-dash .cla-canvas-flow { padding: 18px; }
  .student-dash .student-dash-module-grid { grid-template-columns: 1fr; }
  .student-dash .student-dash-module-grid .student-dash-module { min-height: 91px; border-right: 0 !important; padding: 14px 16px; }
  .student-dash .student-dash-module-icon { width: 48px; height: 48px; flex-basis: 48px; border-radius: 13px; }
  .student-dash .student-dash-module-icon img { width: 38px; height: 38px; }
  .cla-focus-nav .cla-module-subnav-links { gap: 5px; }
  .cla-focus-nav .cla-module-subnav-links a { padding: 9px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
  .student-dash .cla-decision-canvas * { transition: none !important; animation: none !important; }
}

/* CP44 · Surface/text contracts for legacy dark hero components that are now light.
 * These exact selectors previously specified white/ice-blue text on a
 * background inherited from --cla-hero, which CP43 changed to pale blue. */
:is(.profile-head,.nexus-hero,.student-intelligence-hero,.student-panel.dark) {
  background: linear-gradient(135deg,#fff 0%,#f2f7ff 100%) !important;
  border: 1px solid var(--cla-border-subtle) !important;
  color: var(--cla-text-primary) !important;
  box-shadow: 0 12px 36px -30px rgba(24,50,99,.22) !important;
}
:is(.profile-head,.nexus-hero,.student-intelligence-hero,.student-panel.dark) :is(h1,h2,h3,h4) {
  color: var(--cla-text-primary) !important;
}
:is(.profile-head,.nexus-hero,.student-intelligence-hero,.student-panel.dark) p {
  color: var(--cla-text-secondary) !important;
}
.profile-head span,.nexus-hero > div > span,.student-intelligence-eyebrow,
.student-intelligence-hero h2 span,.student-intelligence-live,
.student-panel.dark .student-panel-head > span {
  color: var(--cla-text-link) !important;
}
.student-intelligence-hero-meta > div { background: var(--cla-bg-canvas); border-color: var(--cla-border-subtle); backdrop-filter: none; }

/* Prevent the old translucent on-dark user-role label palette from being

}
/* CP44 expanded legacy-hero audit: CP28 assigned --cla-hero to these

:is(.profile-showcase-left,.student-hero,.about-hero-premium,.contact-hero-premium,

.showcase-copy > span { background: #e9f1fe; border-color: var(--cla-border-subtle); }
/* The login illustration card is now light too; internal stats aren't stuck

.profile-showcase-card { background: #f3f7ff !important; border: 1px solid var(--cla-border-subtle); box-shadow: none; }

.profile-showcase-card .showcase-avatar { color: var(--cla-text-primary); }
.module-path-detail-hero span,.module-detail-main > div > span { color: var(--cla-text-link) !important; }

.module-path-more { background: #e9f1fe; border-color: var(--cla-border-subtle); color: var(--cla-text-link); }
.module-path-action button { color: #fff; background: var(--cla-text-link); opacity: 1; }

/* CP45 — route transitions. The current page remains readable during code load. */
.cla-route-progress {

/* CP46 — The student home is a connected scientific workspace, never a 2x3 tile menu.

.student-dash .cla-horizon,
.student-dash .cla-circuit {
  --cla46-ink: #142D48;
  --cla46-muted: #526A84;
  --cla46-line: #DCE5F1;

.student-dash .cla-horizon a, .student-dash .cla-circuit a { text-decoration: none; }

  outline: 3px solid #316ED4; outline-offset: 4px;
}

/* Exam horizon sits BEFORE the detailed intelligence analytics. */
.student-dash .cla-horizon {

.cla-horizon-live { display: inline-block; width: 7px; height: 7px; margin-right: 6px;
  border-radius: 50%; background: #14837E; box-shadow: 0 0 0 3px #E1F4F1; }
.cla-horizon-head h2, .cla-circuit-heading h2 {

.cla-horizon-head p, .cla-circuit-heading p {

.cla-horizon-settings {

.cla-horizon-settings:hover { background: #E8F1FF; border-color: #8AB0E8; }
.cla-horizon-main { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); min-width: 0; border-top: 1px solid #E4ECF5; }
.cla-horizon-countdown {

.cla-horizon-countdown::after {

.cla-horizon-count-label, .cla-horizon-track-heading {

.cla-horizon-digits { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-size: clamp(64px,7vw,93px); letter-spacing: -.085em;

.cla-horizon-source { font-size: 12px; color: #526A84; margin-top: 5px; }
.cla-horizon-track { padding: 19px 26px 17px; min-width: 0; }
.cla-horizon-track-heading { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; color: #54708E; }
.cla-horizon-milestones { list-style: none; margin: 9px 0 0; padding: 0; }
.cla-horizon-milestones li { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center;
  gap: 13px; padding: 15px 0; border-bottom: 1px solid #E6EDF6; min-width: 0; }
.cla-horizon-milestones li:last-child { border: 0; }
.cla-horizon-track-index { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid #CBD9EA;
  border-radius: 50%; color: #50698A; font-size: 10px; font-weight: 750; font-variant-numeric: tabular-nums; }
.cla-horizon-milestones .is-next .cla-horizon-track-index { color: white; border-color: #3265BD; background: #3265BD; }

.cla-horizon-milestones li>div>span { color: #576E87; font-size: 11px; }
.cla-horizon-milestones li>b { white-space: nowrap; color: #25549F; font-size: 11px; font-weight: 760; }
.cla-horizon-empty { display: grid; align-content: center; gap: 8px; min-height: 191px; }
.cla-horizon-empty>strong { color: #264761; font-size: 14px; font-weight: 740; }

.cla-horizon-placeholder-lines { display: flex; align-items: center; height: 50px; gap: 7px; margin-bottom: 5px; }

.cla-horizon-placeholder-lines span:nth-child(2) { background: #D2DFF0; }

.cla-horizon-foot, .cla-circuit-foot {

.cla-exam-back-home { display: inline-flex; margin: 0 0 16px; padding: 8px 12px; border-radius: 8px;
  border: 1px solid #D5E3F0; background: #F5F9FF; color: #265BA7; font-size: 12px; font-weight: 750; }
.cla-exam-back-home:hover { background: #E6F0FF; }

/* Learning circuit: one connected data-diagram rather than six unrelated boxes. */
.student-dash .cla-circuit { margin: 33px 0 15px; background: #FFFFFF; border: 1px solid #DFE7F1;
  border-radius: 22px; box-shadow: 0 18px 48px -42px rgba(25,59,106,.46); overflow: hidden; }

  font-size: 42px; letter-spacing: -.06em; font-weight: 710; font-variant-numeric: tabular-nums; }
.cla-circuit-counter small { font-size: 9px; font-weight: 800; letter-spacing: .125em; color: #6A7F98; width: 60px; line-height: 1.5; }
.cla-circuit-stage { display: grid; grid-template-columns: minmax(0,1.85fr) minmax(260px,.8fr);

.cla-circuit-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cla-circuit-node {
  position: absolute; z-index: 1; transform: translate(-50%,-50%); width: 137px; min-height: 89px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 7px 5px; border: 1px solid transparent; border-radius: 13px;

.cla-circuit-node:hover,.cla-circuit-node.is-current,.cla-circuit-node:focus-visible {

  box-shadow: 0 10px 25px -19px rgba(17,52,96,.56);
}
.cla-circuit-node-marker { display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid var(--node-color);
  border-radius: 50%; color: var(--node-color); background: #F9FCFF; font-size: 10px; font-weight: 800; line-height: 1; }
.cla-circuit-node strong { font-size: 12px; font-weight: 810; letter-spacing: .065em; color: #1D3958; }
.cla-circuit-node small { color: #526980; font-size: 10px; font-weight: 630; }
.cla-circuit-detail { display: flex; flex-direction: column; gap: 24px; min-width: 0; padding: 24px;

.cla-circuit-detail-top { display: flex; gap: 12px; justify-content: space-between; color: #60758A; letter-spacing: .115em; font-size: 9px; font-weight: 770; }

.cla-circuit-detail-core h3 { margin: 13px 0 12px; color: #173652; font-size: clamp(23px,2.7vw,35px); line-height: 1.17;
  font-weight: 730; letter-spacing: -.05em; }
.cla-circuit-detail-core p { color: #536B84; font-size: 13px; line-height: 1.7; margin: 0; }
.cla-circuit-detail-links { display: grid; gap: 12px; }
.cla-circuit-detail-links>a { display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 13px 15px; background: #265BB1; border-radius: 10px; color: #fff !important; font-size: 12px; font-weight: 770; }
.cla-circuit-detail-links>a:hover { background: #1B478E; }
.cla-circuit-detail-links small { color: #60758A; font-size: 11px; line-height: 1.5; }
.cla-circuit-mobile { display: none; }
.cla-circuit-foot { padding: 12px 28px; }

/* CP62 — Student homepage: a connected workflow/evidence rail instead of two tiles.
 * Dedicated palette for readable contrast in light and dark mode.
 * Source availability is binary; never turn this graphic into a cognitive score. */
.student-dash .cla-action-signal {
  --rail-bg: #fff;
  --rail-soft: #f1f6fd;
  --rail-ink: #142e49;
  --rail-muted: #526c86;
  --rail-line: #dce7f2;
  --rail-accent: #2356a5;
  --rail-available: #146d64;

  margin: 25px 0 30px;
  overflow: hidden;
  border: 1px solid var(--rail-line);
  border-radius: 22px;
  background: var(--rail-bg);
  color: var(--rail-ink);
  box-shadow: 0 18px 48px -44px rgba(13,48,96,.36);
}
.student-dash .cla-action-signal * { box-sizing: border-box; }
.cla-action-signal-heading {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding: 24px 27px 20px;
}
.cla-action-signal-eyebrow,.cla-action-signal-subheading {
  color: var(--rail-accent); font-size: 10px; font-weight: 800; letter-spacing: .105em;
}
.cla-action-signal-heading h2 {
  margin: 7px 0 6px; color: var(--rail-ink); font-size: clamp(22px,2.5vw,30px);
  font-weight: 760; letter-spacing: -.045em; line-height: 1.2;
}
.cla-action-signal-heading p { color: var(--rail-muted); font-size: 12px; line-height: 1.55; margin: 0; }

  display: flex; align-items: center; gap: 10px; flex: 0 0 auto; color: var(--rail-accent);

.cla-module-subnav.cla-focus-nav.cla-guided-workspace {

/* CP67 — keyboard-accessible SPA transitions and a visible-on-focus skip link. */
.cla-skip-to-content {
  position: fixed;
  z-index: 10020;
  top: 8px;
  left: 8px;
  padding: 12px 18px;
  border: 2px solid #0b4784;
  border-radius: 11px;
  background: #fff;
  color: #103d6a;
  font: 700 14px/1.4 'Be Vietnam Pro', sans-serif;
  transform: translateY(calc(-100% - 24px));
  transition: transform .15s ease;
  text-decoration: none;
  box-shadow: 0 8px 22px rgba(20, 37, 61, .2);
}
.cla-skip-to-content:focus-visible,
.cla-skip-to-content:focus {
  transform: translateY(0);
  outline: 3px solid #3177b8;
  outline-offset: 2px;
}
.cla-route-announcement {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
/* The focus target is a neutral container, not a second main landmark. */
#cla-page-content:focus { outline: none; }
#cla-page-content:focus-visible { outline: 3px solid #3177b8; outline-offset: -3px; }
@media (prefers-reduced-motion: reduce) {

}
@media print { .cla-skip-to-content, .cla-route-announcement { display: none !important; } }

/* CP70 UX contrast hotfix: pair foreground and surface colors together.
 * CP44 converted ModuleClusterGrid from a dark hero to a light surface, but
 * CP20 kept its white/pale-blue labels, empty state and status badges.
 * The app currently supports LIGHT only. Scope to this component, without
 * overriding branded dark widgets or enabling unsupported sitewide dark mode.
 */
.module-path-v7 .module-path-detail {
  --map-ink: #17324f;
  --map-secondary: #405a72;
  --map-muted: #526a81;
  --map-link: #2458a5;

}
.module-path-v7 .module-path-action-tools label,
.module-path-v7 .module-path-action-tools > span {
  color: var(--map-secondary);
}
.module-path-v7 .module-path-action-tools input {
  color: var(--map-ink);
  background: var(--map-surface);
  border: 1px solid var(--map-line);
  caret-color: var(--map-link);
}
.module-path-v7 .module-path-action-tools input::placeholder {
  color: var(--map-muted);
  opacity: 1;

.module-path-v7 .module-path-action-meta > span:first-child:not(.module-path-status),
.module-path-v7 .module-path-action-disabled {

}
/* Solid, paired status chips: the old translucent backgrounds inherited a white
 * canvas while their text remained nearly white (invisible at normal sizes). */
.module-path-v7 .module-path-status.is-available { color: #176346; background: #dff4e9; }
.module-path-v7 .module-path-status.is-partial { color: #754216; background: #fff0d8; }
.module-path-v7 .module-path-status.is-planned { color: #40566e; background: #e9f0f8; }
.module-path-v7 .module-path-empty {
  color: var(--map-ink);
  background: var(--map-soft);
  border: 1px dashed var(--map-line);
}
.module-path-v7 .module-path-empty p { color: var(--map-secondary); }
.module-path-v7 .module-path-empty button {
  color: #fff;
  background: var(--map-link);
  border: 1px solid var(--map-link);
}
.module-path-v7 .module-path-empty button:hover { background: #183f7b; }
.module-path-v7 .module-path-action-tools input:focus-visible,
