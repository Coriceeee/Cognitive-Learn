  min-height: 44px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid transparent;
  color: var(--unav-ink);
  background: var(--unav-soft);
  font-size: 12px;
  font-weight: 690;
  text-decoration: none;
  white-space: normal;
}
.cla-unified-bar .cla-guided-more-content a:hover { border-color: var(--unav-line); background: var(--unav-hover); }
.cla-unified-bar :is(a,summary):focus-visible { outline: 3px solid var(--unav-focus); outline-offset: 2px; }
:root[data-theme="dark"] .cla-module-subnav.cla-focus-nav.cla-guided-workspace.cla-unified-bar {
  --unav-surface: #142439;
  --unav-ink: #f2f7ff;
  --unav-muted: #c5d5e8;
  --unav-line: #405a75;
  --unav-soft: #1c334c;
  --unav-hover: #234669;
  --unav-accent: #a9d1ff;
  --unav-selected-ink: #f1f7ff;
  --unav-focus: #7dbbff;
  box-shadow: none;
}
/* In-page filters are not route tabs: they retain their behavior, but share
 * control density, focus affordance, and paired surface/ink tokens. */
:is(.cla-workflow-tabs,.profile-grade-tabs,.profile-semester-tabs,.cla-task-filters) {
  --unav-local-ink: #193552;
  --unav-local-soft: #f2f6fb;
  --unav-local-selected: #1957ab;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border: 1px solid #d8e3ef;
  border-radius: 12px;
  background: #fff;
}
:is(.cla-workflow-tabs,.profile-grade-tabs,.profile-semester-tabs,.cla-task-filters) :is(a,button) {
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  box-shadow: none;
  background: var(--unav-local-soft);
  color: var(--unav-local-ink);
  font-size: 12px;
  font-weight: 680;
}
:is(.cla-workflow-tabs,.profile-grade-tabs,.profile-semester-tabs,.cla-task-filters) :is(a,button):is(.active,[aria-current="page"],[aria-pressed="true"]) {
  color: #fff;
  background: var(--unav-local-selected);
  border-color: var(--unav-local-selected);
}
:root[data-theme="dark"] :is(.cla-workflow-tabs,.profile-grade-tabs,.profile-semester-tabs,.cla-task-filters) {
  --unav-local-ink: #edf5ff;
  --unav-local-soft: #213853;
  --unav-local-selected: #abd4ff;
  background: #142439;
  border-color: #405a75;
}
:root[data-theme="dark"] :is(.cla-workflow-tabs,.profile-grade-tabs,.profile-semester-tabs,.cla-task-filters) :is(a,button):is(.active,[aria-current="page"],[aria-pressed="true"]) {
  color: #142439;
}
@media (max-width: 900px) {
  .cla-module-subnav.cla-focus-nav.cla-guided-workspace.cla-unified-bar { flex-wrap: wrap; gap: 6px 10px; padding: 10px; }
  .cla-unified-bar .cla-unified-identity { border-right: 0; }
  .cla-unified-bar .cla-module-subnav-links.cla-guided-primary.cla-unified-tabs {
    flex: 1 0 100%;
    order: 3;
    gap: 3px;
    padding-top: 5px;
    border-top: 1px solid var(--unav-line);
  }
  .cla-unified-bar .cla-module-subnav-links.cla-guided-primary.cla-unified-tabs a { padding-inline: 12px; }
}
@media (max-width: 640px) {
  .cla-unified-bar .cla-module-subnav-links.cla-guided-primary.cla-unified-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 3px 6px;
    overflow: visible;
  }
  .cla-unified-bar .cla-module-subnav-links.cla-guided-primary.cla-unified-tabs a {
    width: 100%;
    min-width: 0;
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: left;
    justify-content: flex-start;
  }
}
@media (max-width: 480px) {
  .cla-module-subnav.cla-focus-nav.cla-guided-workspace.cla-unified-bar { border-radius: 11px; }
  .cla-unified-bar .cla-unified-identity strong { font-size: 12px; }
  .cla-unified-bar .cla-guided-more-content { grid-template-columns: minmax(0,1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .cla-unified-bar :is(a,summary,.cla-guided-chevron) { transition: none !important; }
}

/* CP74 UI system: explicit action styles + public information pages.
 * The old /about and /contact marketing classes remain in 06-info.css for
 * historical compatibility, but these pages use the isolated cla-public-* API.
 * Every text color below is paired with an explicit surface color. */
:root {
  --cla-ui-ink: #182f4b;
  --cla-ui-muted: #506780;
  --cla-ui-line: #cfdeec;
  --cla-ui-surface: #ffffff;
  --cla-ui-soft: #f3f7fc;
  --cla-ui-blue: #1957ab;
  --cla-ui-blue-hover: #124683;
  --cla-ui-blue-soft: #e8f1ff;
  --cla-ui-focus: #006ac2;
}
:root[data-theme="dark"] {
  --cla-ui-ink: #f2f7ff;
  --cla-ui-muted: #c7d7e9;
  --cla-ui-line: #45617f;
  --cla-ui-surface: #14253b;
  --cla-ui-soft: #1e3450;
  --cla-ui-blue: #bddbff;
  --cla-ui-blue-hover: #e2f0ff;
  --cla-ui-blue-soft: #224467;
  --cla-ui-focus: #9bcbff;
}
/* Shared action style: use on forms, retry states and information pages. */
.cla-action-button,
:where(.app-root main button:not([class])) {
  box-sizing: border-box;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 43px;
  width: auto;
  max-width: 100%;
  padding: 10px 16px;
  border: 1px solid var(--cla-ui-line);
  border-radius: 10px;
  color: var(--cla-ui-ink);
  background: var(--cla-ui-surface);
  font: inherit;
  font-size: 13px;
  line-height: 1.4;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  box-shadow: none;
  transform: none;
  cursor: pointer;
  transition: background .17s, border-color .17s, color .17s;
}
.cla-action-button:hover,
:where(.app-root main button:not([class])):hover { border-color: var(--cla-ui-blue); background: var(--cla-ui-blue-soft); color: var(--cla-ui-ink); }
.cla-action-button--primary {
  background: #1957ab;
  border-color: #1957ab;
  color: #fff;
}
.cla-action-button--primary:hover { background: #124683; border-color: #124683; color: #fff; }
.cla-action-button--outline { background: var(--cla-ui-surface); color: var(--cla-ui-ink); }
.cla-action-button--quiet { border-color: transparent; background: transparent; color: var(--cla-ui-muted); }
.cla-action-button--quiet:hover { color: var(--cla-ui-ink); background: var(--cla-ui-soft); }
.cla-action-button:focus-visible,
:where(.app-root main button:not([class])):focus-visible { outline: 3px solid var(--cla-ui-focus); outline-offset: 3px; }
.cla-action-button:disabled,
:where(.app-root main button:not([class])):disabled { opacity: .58; cursor: not-allowed; }
/* Recovery controls are separate from the sticky form action row. */
.profile-page .profile-message[role="alert"] {
  text-align: left;
  color: #7b3517;
  background: #fff3e8;
  border-color: #f2cba9;
  line-height: 1.55;
}
.profile-page .profile-message[role="alert"] + .cla-action-button { margin: 12px 0 8px; }
.profile-page .cla-action-button--outline { justify-self: start; align-self: start; width: max-content; max-width: 100%; }
:root[data-theme="dark"] .profile-page .profile-message[role="alert"] {
  color: #ffddc4;
  background: #3f2c27;
  border-color: #936043;
}

/* About and Contact: same editorial system and a single non-layered shell. */
.cla-public-page {
  box-sizing: border-box;
  min-height: 100vh;
  width: 100%;
  overflow-x: clip;
  color: var(--cla-ui-ink);
  background: #f5f8fc;
  padding: 20px clamp(14px, 3vw, 46px) 60px;
}
:root[data-theme="dark"] .cla-public-page { background: #0c1929; }
.cla-public-page *, .cla-public-page *::before, .cla-public-page *::after { box-sizing: border-box; }
.cla-public-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  max-width: 1300px;
  margin: 0 auto;
  min-height: 64px;
  padding: 9px 16px;
  border: 1px solid var(--cla-ui-line);
  border-radius: 14px;
  background: var(--cla-ui-surface);
  box-shadow: 0 3px 18px rgba(18, 47, 81, .045);
}
.cla-public-logo { display: inline-flex; align-items: center; flex: 0 0 auto; }
.cla-public-logo img { display: block; width: 125px; max-width: 24vw; height: auto; }
.cla-public-header-nav { display: flex; align-items: center; gap: 5px; margin-left: auto; }
.cla-public-header-nav a {
  min-height: 39px;
  display: flex;
  align-items: center;
  padding: 8px 13px;
  color: var(--cla-ui-muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  border-radius: 8px;
}
.cla-public-header-nav a[aria-current="page"] { color: var(--cla-ui-ink); background: var(--cla-ui-blue-soft); }
.cla-public-header-nav a:hover { background: var(--cla-ui-soft); color: var(--cla-ui-ink); }
.cla-public-header :is(a,button):focus-visible,
.cla-public-shell :is(a,button,input,select,textarea):focus-visible {
  outline: 3px solid var(--cla-ui-focus);
  outline-offset: 3px;
}
.cla-public-shell { max-width: 1300px; margin: 22px auto 0; }
.cla-public-eyebrow {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.5;
  letter-spacing: .11em;
  color: #1d5aa5;
}
:root[data-theme="dark"] .cla-public-eyebrow { color: #acdaff; }
.cla-public-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.24fr) minmax(340px, .76fr);
  gap: clamp(20px, 3.5vw, 50px);
  align-items: center;
  min-height: 470px;
  padding: clamp(28px, 5vw, 64px);
  border: 1px solid #163e73;
  border-radius: 21px;
  color: #eff7ff;
  background: linear-gradient(125deg, #102847 0%, #173e72 72%, #1b528b 100%);
  overflow: hidden;
}
.cla-public-hero .cla-public-eyebrow { color: #a9d7ff; }
.cla-public-hero h1,
.cla-contact-intro h1 {
  max-width: 14ch;
  margin: 17px 0 0;
  font-size: clamp(37px, 4.4vw, 65px);
  line-height: 1.09;
  font-weight: 790;
  letter-spacing: -.045em;
}
.cla-public-hero-copy > p {
  max-width: 65ch;
  margin: 19px 0 0;
  font-size: 16px;
  line-height: 1.75;
  color: #d7e7f7;
}
.cla-public-hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.cla-public-hero .cla-action-button--primary { background: #d8ebff; border-color: #d8ebff; color: #113561; }
.cla-public-hero .cla-action-button--primary:hover { background: #fff; border-color: #fff; color: #113561; }
.cla-public-hero .cla-action-button--outline { border-color: #6d94c0; background: transparent; color: #fff; }
.cla-public-hero .cla-action-button--outline:hover { background: #244b78; color: #fff; }
.cla-public-journey {
  padding: 24px;
  border-radius: 17px;
  background: rgba(255,255,255,.085);
  border: 1px solid rgba(206,232,255,.25);
}
.cla-public-panel-label { color: #a7d2ff; font-size: 10px; font-weight: 780; letter-spacing: .11em; }
.cla-public-journey ol { list-style: none; margin: 17px 0 16px; padding: 0; }
.cla-public-journey li { display: flex; gap: 15px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid rgba(219,238,255,.15); }
.cla-public-journey li > span { color: #a8d4ff; font-size: 13px; font-weight: 800; padding-top: 1px; }
.cla-public-journey li strong { display: block; font-size: 14px; color: #fff; }
.cla-public-journey li small { display: block; margin-top: 4px; color: #bad5f0; font-size: 12px; }
.cla-public-journey > p { margin: 10px 0 0; color: #c7dcef; font-size: 12px; line-height: 1.6; }
.cla-public-section {
  margin-top: 22px;
  padding: clamp(24px, 3vw, 38px);
  border: 1px solid var(--cla-ui-line);
  border-radius: 20px;
  background: var(--cla-ui-surface);
}
.cla-public-section-heading { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 24px; }
.cla-public-section-heading h2,
.cla-public-footer-callout h2,
.cla-contact-compose-aside h2 { max-width: 19ch; margin: 9px 0 0; color: var(--cla-ui-ink); font-size: clamp(27px, 2.7vw, 39px); font-weight: 780; letter-spacing: -.035em; line-height: 1.15; }
.cla-public-section-heading > p { max-width: 47ch; margin: 0; color: var(--cla-ui-muted); font-size: 14px; line-height: 1.7; }
.cla-public-module-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
.cla-public-module {
  min-width: 0;
  min-height: 244px;
  padding: 22px;
  border: 1px solid var(--cla-ui-line);
  border-radius: 13px;
  background: var(--cla-ui-soft);
}
.cla-public-module img { display: block; width: 43px; height: 43px; object-fit: contain; margin-bottom: 13px; border-radius: 9px; }
.cla-public-module > span { color: var(--cla-ui-blue); font-size: 11px; letter-spacing: .07em; font-weight: 800; }
.cla-public-module h3 { margin: 6px 0 8px; color: var(--cla-ui-ink); font-size: 18px; letter-spacing: -.02em; }
.cla-public-module p { margin: 0; color: var(--cla-ui-muted); font-size: 13px; line-height: 1.65; min-height: 62px; }
.cla-public-module a { display: inline-flex; align-items: center; gap: 8px; margin-top: 13px; color: var(--cla-ui-blue); font-weight: 760; font-size: 13px; text-decoration: none; }
.cla-public-module a:hover { text-decoration: underline; text-underline-offset: 4px; }
.cla-public-principle-list { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
.cla-public-principle-list article { display: flex; gap: 14px; padding: 20px 4px; border-top: 2px solid var(--cla-ui-line); }
.cla-public-principle-list article > span { color: var(--cla-ui-blue); font-size: 13px; font-weight: 800; }
.cla-public-principle-list h3 { margin: 0 0 8px; font-size: 16px; color: var(--cla-ui-ink); }
.cla-public-principle-list p { margin: 0; line-height: 1.7; color: var(--cla-ui-muted); font-size: 13px; }
.cla-public-evidence-note {
  margin: 14px 0 0;
  padding: 15px 18px;
  border-left: 3px solid #367ebc;
  border-radius: 5px 10px 10px 5px;
  color: var(--cla-ui-ink);
  background: var(--cla-ui-soft);
  font-size: 13px;
  line-height: 1.7;
}
.cla-public-footer-callout {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-top: 22px;
  padding: 32px clamp(24px, 3vw, 38px);
  border-radius: 18px;
  border: 1px solid var(--cla-ui-line);
  background: var(--cla-ui-blue-soft);
}
.cla-public-footer-callout h2 { font-size: 28px; }
.cla-public-footer-callout p { color: var(--cla-ui-muted); margin: 10px 0 0; line-height: 1.6; }

/* Contact: no misleading inert 'Send' button and no admin/teacher routing. */
.cla-contact-intro {
  display: grid;
  grid-template-columns: minmax(0,1.4fr) minmax(280px,.6fr);
  gap: 28px;
  align-items: center;
  padding: clamp(28px,4vw,52px);
  border: 1px solid var(--cla-ui-line);
  border-radius: 20px;
  background: var(--cla-ui-surface);
}
.cla-contact-intro h1 { max-width: 17ch; font-size: clamp(34px,4.1vw,57px); color: var(--cla-ui-ink); }
.cla-contact-intro > div:first-child > p { max-width: 68ch; margin: 17px 0 0; color: var(--cla-ui-muted); font-size: 15px; line-height: 1.7; }
.cla-contact-address { min-width: 0; display: grid; gap: 10px; padding: 22px; border-radius: 15px; background: #142d50; border: 1px solid #315a84; color: #fff; }
.cla-contact-address strong { font-size: 21px; }
.cla-contact-address a { color: #c6e4ff; overflow-wrap: anywhere; font-size: 14px; font-weight: 750; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.cla-contact-address small { color: #d2e3f5; font-size: 12px; line-height: 1.7; }
.cla-contact-topic-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; }
.cla-contact-topic-grid a {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 204px;
  padding: 18px;
  border: 1px solid var(--cla-ui-line);
  border-radius: 12px;
  color: var(--cla-ui-ink);
  background: var(--cla-ui-soft);
  text-decoration: none;
}
.cla-contact-topic-grid a:hover { border-color: var(--cla-ui-blue); }
.cla-contact-topic-grid a.is-selected { border-color: var(--cla-ui-blue); background: var(--cla-ui-blue-soft); box-shadow: inset 0 0 0 1px var(--cla-ui-blue); }
.cla-contact-topic-grid a > span { font-size: 12px; color: var(--cla-ui-blue); font-weight: 800; }
.cla-contact-topic-grid strong { margin-top: 13px; font-size: 15px; line-height: 1.4; }
.cla-contact-topic-grid p { font-size: 12px; line-height: 1.6; color: var(--cla-ui-muted); }
.cla-contact-topic-grid small { margin-top: auto; color: var(--cla-ui-blue); font-size: 11px; font-weight: 750; }
.cla-contact-compose {
  display: grid;
  grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr);
  gap: 38px;
  margin-top: 22px;
  padding: clamp(24px,3vw,38px);
  border: 1px solid var(--cla-ui-line);
  border-radius: 20px;
  background: var(--cla-ui-surface);
  scroll-margin-top: 20px;
}
.cla-contact-compose-aside > p { color: var(--cla-ui-muted); font-size: 14px; line-height: 1.75; }
.cla-contact-compose-aside > p strong { color: var(--cla-ui-ink); }
.cla-contact-tip { padding: 20px; margin-top: 25px; border: 1px solid var(--cla-ui-line); border-radius: 12px; background: var(--cla-ui-soft); }
.cla-contact-tip strong { color: var(--cla-ui-ink); font-size: 14px; }
.cla-contact-tip p { color: var(--cla-ui-muted); font-size: 13px; line-height: 1.7; margin: 9px 0 0; }
.cla-contact-form { display: grid; gap: 9px; min-width: 0; }
.cla-contact-form label { color: var(--cla-ui-ink); font-weight: 750; font-size: 13px; margin-top: 7px; }
.cla-contact-form label span { color: var(--cla-ui-muted); font-weight: 500; }
.cla-contact-form :is(input,select,textarea) {
  width: 100%;
  max-width: 100%;
  min-height: 45px;
  padding: 11px 13px;
  color: var(--cla-ui-ink);
  background: var(--cla-ui-surface);
  border: 1px solid var(--cla-ui-line);
  border-radius: 9px;
  font: inherit;
  font-size: 14px;
  line-height: 1.55;
  resize: vertical;
}
.cla-contact-form :is(input,textarea)::placeholder { color: var(--cla-ui-muted); opacity: .78; }
.cla-contact-form textarea { min-height: 140px; }
.cla-contact-form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.cla-contact-delivery-note { margin: 9px 0 0; color: var(--cla-ui-muted); font-size: 12px; line-height: 1.7; }
:root[data-theme="dark"] .cla-action-button--primary { color: #fff; background: #2366ba; border-color: #7ba9e3; }
:root[data-theme="dark"] .cla-action-button--primary:hover { background: #2b76ce; color: #fff; }
:root[data-theme="dark"] .cla-public-hero .cla-action-button--primary { background: #d8ebff; border-color: #d8ebff; color: #113561; }
:root[data-theme="dark"] .cla-contact-address { background: #11213a; border-color: #52749a; }
@media (max-width: 1000px) {
  .cla-public-hero { grid-template-columns: minmax(0,1fr); }
  .cla-public-journey { max-width: none; }
  .cla-contact-topic-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .cla-public-module-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 720px) {
  .cla-public-page { padding: 10px 12px 40px; }
  .cla-public-header { padding: 10px; gap: 9px; flex-wrap: wrap; }
  .cla-public-logo img { width: 99px; }
  .cla-public-header-nav { order: 3; margin-left: 0; flex: 1 0 100%; justify-content: center; border-top: 1px solid var(--cla-ui-line); padding-top: 6px; }
  .cla-public-shell { margin-top: 12px; }
  .cla-public-hero, .cla-contact-intro, .cla-contact-compose { grid-template-columns: minmax(0,1fr); gap: 22px; padding: 24px; border-radius: 14px; }
  .cla-public-hero h1, .cla-contact-intro h1 { font-size: clamp(31px,7vw,44px); }
  .cla-public-section { padding: 21px; border-radius: 14px; }
