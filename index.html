  <head>
    <meta charset="UTF-8" />

    <title>Cognitive Learn AI</title>
    <link rel="icon" type="image/png" href="/logo cla.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="color-scheme" content="light" />
    <script>
      /* CP44: light-only. A partial dark-mode skin produced white text on white
         analytical cards; do not activate it until a complete contrast audit. */
      (function () {
        var r = document.documentElement;
        r.setAttribute("data-theme", "light");
        r.setAttribute("data-theme-pref", "light");
        r.style.colorScheme = "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
