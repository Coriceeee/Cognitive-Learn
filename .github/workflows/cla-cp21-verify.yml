name: CLA CP21 source and security checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Synchronize dependencies
        run: npm install
      - name: Require committed lockfile parity
        run: |
          git diff --exit-code -- package-lock.json || {
            echo 'package-lock.json is not synchronized. Run npm install and commit the lockfile.'
            exit 1
          }
      - name: Verify reproducible dependency install
        run: npm ci
      - name: Audit production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Validate repository layout
        run: npm run check:layout
      - name: Test academic engine
        run: npm test
      - name: Test frontend and API compilation, build
        run: npm run build
      - name: Check research technical gates (not real student outcomes)
        run: |
          python -m unittest discover -s tests -p 'test_research_scope.py' -v
          python research/src/validate_benchmark.py
          python research/src/audit_dataset.py --input research/data/synthetic_demo/scope_gate_smoke.csv --output research/evidence/DATA_SCOPE_GATE_SMOKE_RESULT.json
      - name: Static rules contract smoke tests
        run: npm run test:rules:static
      - name: Install Firebase CLI (emulator only)
        run: npm install -g firebase-tools
      - name: Run 33 authenticated/unauthenticated emulator cases (no deploy)
        run: npm run test:rules:emulator
