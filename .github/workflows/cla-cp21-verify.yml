name: CLA CP21 source and security checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Check dependency and lockfile readiness
        run: npm run check:dependencies
      - name: Audit production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Validate repository layout
        run: npm run check:layout
      - name: Test unsaved-draft SPA navigation (incl. Back/Forward)
        run: npm run test:cp56:navigation:integration
      - name: Test Firestore draft timestamp resolution and conflict safety
        run: npm run test:cp57:timestamp
      - name: Test CP58 verified Seed prefill and query-only SPA navigation
        run: npm run test:cp58:integration
      - name: Test CP59 server-verified draft integration across Orion, Pulse and Haven
        run: npm run test:cp59:verified-drafts
      - name: Test CP60 Seed fallback listener stability
        run: npm run test:cp60:seed-listener
      - name: Test CP61 module draft legacy callback ordering
        run: npm run test:cp61:legacy-drafts
      - name: Test CP62 dashboard source-availability rail
        run: npm run test:cp62:student-rail
      - name: Test CP63 guided six-module workspaces
        run: npm run test:cp63:guided-workspaces
      - name: Test CP67 accessible SPA transitions and filter scroll preservation
        run: npm run test:cp67:route-experience
      - name: Test CP68 browser QA readiness and Back Forward keyboard experience
        run: npm run test:cp68:qa-gate
      - name: Test CP69 Atlas atomic revision and verified Companion consent
        run: npm run test:cp69:firebase-integration
      - name: CP70 six-module student journey
        run: npm run test:cp70:journey
      - name: Test academic engine
        run: npm test
      - name: Test frontend and API compilation, build
        run: npm run build
      - name: Check research technical gates (not real student outcomes)
        run: |
          python -m unittest discover -s tests -p 'test_research_scope.py' -v
          python -m unittest discover -s tests -p 'test_cp53_safe_packaging.py' -v
          python research/src/validate_benchmark.py
          python research/src/audit_dataset.py --input research/data/synthetic_demo/scope_gate_smoke.csv --output research/evidence/DATA_SCOPE_GATE_SMOKE_RESULT.json
      - name: Static rules contract smoke tests
        run: npm run test:rules:static
      - name: Install Firebase CLI (emulator only)
        run: npm install -g firebase-tools
      - name: Run authenticated/unauthenticated emulator cases (no deploy)
        run: npm run test:rules:emulator

      - name: CP71 unified student navigation (offline)
        run: npm run test:cp71:unified-nav

      - name: CP72 deterministic Lumen fallback and safe Gemini routing
        run: npm run test:cp72:lumen-fallback

      - name: CP73 safe local Firebase emulator mode and MVP QA gating (offline)
        run: npm run test:cp73:mvp
