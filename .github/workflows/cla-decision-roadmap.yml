name: CLA decision roadmap verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cla-decision-roadmap.yml"
      - "src/**"
      - "api/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "tools/**"
      - "functions-gemini/**"
      - "firebase*.json"
      - "vercel.json"
      - ".env.example"
      - "docs/**"
      - "CP93_SOURCE_MANIFEST.json"
      - "*.cmd"
      - "*.ps1"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source layout
        run: npm run check:layout
      - name: P2 — Goal Gap Optimizer and Decision Snapshot
        run: npm run test:decision-p2
      - name: P3 — Personal decision context and admission handoff
        run: npm run test:decision-p3
      - name: P4 — Adaptive closed-loop journey
        run: npm run test:decision-p4
      - name: P5 — Final decision workflow contracts
        run: npm run test:decision-p5
      - name: Personal learning advice follow-up
        run: npm run test:advisor:personal-learning
      - name: Six-module Learning Network menu
        run: npm run test:cp87:nav
      - name: CP94 first-run admissions journey and preserved six-module navigation
        run: npm run test:cp94:student-first-run
      - name: CP94 repaired regressions across profile, handoff, navigation, UX and admissions
        run: |
          npm run test:cp29:batch4
          npm run test:cp30:batch4
          npm run test:cp30:profile
          npm run test:cp30:realtime
          npm run test:cp32:national
          npm run test:cp34:knowledge-xai
          npm run test:cp40:student-only
          npm run test:cp42:dthu-scheme
          npm run test:cp42:scheme-coverage
          npm run test:cp42:robust-decision
          npm run test:cp56:navigation:integration
          npm run test:cp58:integration
          npm run test:cp60:seed-listener
          npm run test:cp62:student-rail
          npm run test:cp64:input-ux
          npm run test:cp70:journey
          npm run test:decision-handoff
          npm run test:cp73:mvp
          npm run test:rules:static
          npm run test:rules:v5:static
          npm run test:rules:gate-unit
      - name: Full offline regression suite
        run: |
          npm test
          npm run test:cp75:ux-audit
          npm run test:cp79:theme
          npm run test:seed-atlas
          npm run test:cp83:ops
      - name: Atlas projection and historical-source safeguards
        run: npm run test:cp88:projection-admissions
      - name: P3 — National university pathways and source coverage
        run: node --experimental-strip-types --test tests/cp42-national-pathways.test.mjs
      - name: P3 — Institution discovery and exact school crosswalk
        run: node --experimental-strip-types --test tests/cp42-institution-discovery.test.mjs
      - name: CP97 — verified cross-module data lineage and empty Seed curriculum
        run: npm run test:cp97:integration
      - name: TypeScript API and production build
        run: npm run build
      - name: CP98 — Firebase Spark + Vercel Gemini API contract
        run: npm run test:cp98:spark-vercel
      - name: Package complete tracked repository source
        run: git archive --format=zip --output=Cognitive-Learn-FULL.zip HEAD
      - name: Upload full source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Cognitive-Learn-FULL-${{ github.sha }}
          path: Cognitive-Learn-FULL.zip
          if-no-files-found: error
          retention-days: 7
      # Optional live smoke check. Configure the repository variable after Vercel is deployed.
      - name: Vercel Gemini production status smoke check (manual release verification)
        if: github.event_name == 'workflow_dispatch' && vars.CLA_GEMINI_API_BASE_URL != ''
        env:
          CLA_GEMINI_API_BASE_URL: ${{ vars.CLA_GEMINI_API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const base = (process.env.CLA_GEMINI_API_BASE_URL || '').replace(/\\/+$/, '');
          if (!/^https:\\/\\/[^/?#]+$/.test(base)) throw new Error('CLA_GEMINI_API_BASE_URL must be an HTTPS origin.');
          const origins = ['https://cognitivelearn.ai.vn','https://cognitive-learn-ai.web.app','https://cognitive-learn-ai.firebaseapp.com'];
          let failed = false;
          for (const origin of origins) {
            try {
              const response = await fetch(base + '/api/cla-gemini-status', { headers: { origin, 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(12000) });
              const contentType = response.headers.get('content-type') || '';
              const raw = await response.text();
              let body = null;
              try { body = JSON.parse(raw); } catch {}
              const cors = response.headers.get('access-control-allow-origin');
              const passed = response.ok && contentType.toLowerCase().includes('application/json') && cors === origin
                && body?.ok === true && body?.configured === true && body?.backend === 'Vercel Functions';
              console.log(JSON.stringify({ origin, httpStatus: response.status, contentType, cors, configured: body?.configured ?? false, backend: body?.backend ?? null, passed }));
              if (!passed) failed = true;
            } catch (error) {
              console.log(JSON.stringify({ origin, reachable: false, error: error?.name ?? 'unknown' }));
              failed = true;
            }
          }
          if (failed) process.exitCode = 1;
          else console.log('CP98 VERCEL PRODUCTION SMOKE PASS.');
          NODE
